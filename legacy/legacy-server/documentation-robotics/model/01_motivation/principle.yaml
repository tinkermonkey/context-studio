motivation.principle.local-first-by-default:
  id: 2e9ed3f2-fede-4e62-9daa-f9bf9419825c
  path: motivation.principle.local-first-by-default
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: Local-First by Default
  description: All data stored locally in SQLite; cloud sync is an optional
    add-on, not a requirement — the application must function fully offline
  attributes:
    category: architecture
  source_reference:
    provenance: extracted
    locations:
      - file: config.json
        symbol: database
  metadata:
