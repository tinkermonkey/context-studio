motivation.principle.api-key-authentication-only:
  id: 92eb69b7-6875-4138-92ab-6ede349ccb0d
  path: motivation.principle.api-key-authentication-only
  spec_node_id: motivation.principle
  type: principle
  layer_id: motivation
  name: API-Key Authentication Only
  description: The application uses a lightweight X-API-Key header for security;
    no OAuth, sessions, or user accounts — consistent with local-first desktop
    operation
  attributes:
    category: security
  source_reference:
    provenance: extracted
    locations:
      - file: config.json
        symbol: security.require_secure_key
  metadata:
    created_at: 2026-03-23T12:43:53.153Z
