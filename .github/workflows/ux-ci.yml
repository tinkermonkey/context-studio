name: UX CI

on:
  push:
    branches: [main]
    paths:
      - "ux/**"
      - ".github/workflows/ux-ci.yml"
  pull_request:
    paths:
      - "ux/**"
      - ".github/workflows/ux-ci.yml"

defaults:
  run:
    working-directory: ux

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # don't install git hooks in CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ux/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hard gates — must pass.
      - name: Validate selector contract
        run: npm run validate-selectors

      - name: Unit tests
        run: npm run test

      # Reported but non-blocking until the pre-existing tsc errors
      # (design/ prototype, flavor types, CommandPalette test) are resolved.
      - name: Typecheck (non-blocking)
        run: npm run typecheck
        continue-on-error: true
