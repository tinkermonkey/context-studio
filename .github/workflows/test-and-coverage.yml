name: Test and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and activate venv
        working-directory: ./local-server
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: ./local-server
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify domain purity
        working-directory: ./local-server
        run: python scripts/check_domain_imports.py

      - name: Run pytest
        working-directory: ./local-server
        run: pytest tests/ -v --tb=short -m "not e2e"

  test-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./ux
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: ./ux
        run: npm run typecheck

      - name: Run tests and collect coverage (c8)
        working-directory: ./ux
        run: npm run test:coverage:c8

      - name: Upload coverage lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: ux/coverage/lcov.info
          retention-days: 7

# E2E (Playwright) is intentionally NOT run in CI. The full E2E cycle
# — including smoke, selector contract, and full suite — is run locally
# as part of the developer SDLC. See ux/e2e/README.md for the local
# workflow and the playwright-test-{planner,generator,healer} agents
# under .claude/agents/switchyard/.
