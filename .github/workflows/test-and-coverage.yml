name: Test and Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./ux
        run: npm ci

      - name: Run tests and collect coverage (c8)
        working-directory: ./ux
        run: npm run test:coverage:c8

      - name: Upload coverage lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: ux/coverage/lcov.info
          retention-days: 7
