- type: add
  elementId: motivation.principle.hexagonal-architecture-dependency-inversion
  layerName: motivation
  after:
    id: 6503b06e-b5ed-4997-96cb-d24cf02a5fbe
    path: motivation.principle.hexagonal-architecture-dependency-inversion
    spec_node_id: motivation.principle
    type: principle
    layer_id: motivation
    name: Hexagonal Architecture — Dependency Inversion
    description: All dependencies point inward. Domain core has zero imports from
      infrastructure, framework, or adapter code. Infrastructure changes never
      require domain changes. Verified by check_domain_imports.py
    attributes:
      category: architecture
    source_reference:
      provenance: extracted
      locations:
        - file: rearchitecture/architecture_design.md
    metadata:
      created_at: 2026-03-24T08:45:19.531Z
      updated_at: 2026-03-24T08:45:19.531Z
      version: 1
  timestamp: 2026-03-24T08:45:19.554Z
  sequenceNumber: 6
