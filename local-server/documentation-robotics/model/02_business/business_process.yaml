  path: business.businessprocess.knowledge-extraction-workflow
  spec_node_id: business.businessprocess
  type: businessprocess
  layer_id: business
  name: Knowledge Extraction Workflow
  description: "Process of automatically extracting ontology entities from text:
    submit text to extraction endpoint, receive extracted entities with
    confidence scores, review and accept matching entities into the knowledge
    graph"
  metadata:
    created_at: 2026-03-24T08:44:22.162Z
    updated_at: 2026-03-24T08:44:22.162Z
    version: 1
