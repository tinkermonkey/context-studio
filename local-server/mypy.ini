[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = False

# Packages with installed type stubs:
# pandas-stubs, types-requests, types-psutil, types-cachetools, types-jsonschema

# Third-party packages without type stubs
[mypy-nltk.*]
ignore_missing_imports = True

