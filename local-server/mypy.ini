[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Packages with installed type stubs (no overrides needed):
# pandas-stubs, types-requests, types-psutil, types-cachetools, types-jsonschema, types-networkx,
# types-PyYAML, types-python-dateutil, types-setuptools, types-toml, types-Pillow, types-urllib3,
# types-Werkzeug, types-cryptography, boto3-stubs, sqlalchemy[mypy]
# rdflib 7.x ships with inline types (py.typed) - no separate stubs needed
#
# Note: types-psutil, types-requests are now installed and configured

# Third-party packages with type stubs installed
# Note: These should be listed but NOT have ignore_missing_imports = True
# since type stubs (types-*) packages are installed for them

# Packages with installed type stubs (no ignore_missing_imports needed)
[mypy-requests.*]
# types-requests is installed via requirements.txt

[mypy-psutil.*]
# types-psutil is installed via requirements_test.txt

# Third-party packages without type stubs
[mypy-aiohttp.*]
ignore_missing_imports = True

