[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
exclude = venv, .venv
warn_unreachable = True
disallow_any_unimported = True
follow_untyped_imports = True

# Third-party packages with type stubs installed
[mypy-networkx.*]
# types-networkx is installed via requirements-dev.txt

# Third-party packages without type stubs
[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-duckdb.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
# pyarrow-stubs is installed via requirements-dev.txt

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-rdflib.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-spacy.*]
ignore_missing_imports = True

[mypy-datasets]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
disallow_any_unimported = False
follow_untyped_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True
