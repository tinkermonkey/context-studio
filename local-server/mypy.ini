[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Packages with installed type stubs:
# pandas-stubs, types-requests, types-psutil, types-cachetools, types-jsonschema, types-networkx
# rdflib 7.x ships with inline types (py.typed) - no separate stubs needed

# Third-party packages without type stubs
[mypy-nltk.*]
ignore_missing_imports = True

[mypy-sqlite_vec.*]
ignore_missing_imports = True

