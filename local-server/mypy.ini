[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = False

# Type stubs are installed for these packages:
# types-requests, types-psutil, pandas-stubs, types-jsonschema, boto3-stubs

# Allow untyped imports for packages that don't have type stubs
[mypy-spacy.*]
ignore_missing_imports = True

