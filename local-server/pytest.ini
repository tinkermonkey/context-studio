[pytest]
asyncio_mode = auto
markers =
    e2e: marks tests as end-to-end tests with real services (deselect with '-m "not e2e"')
    nlp: marks tests as requiring NLP dependencies (deselect with '-m "not nlp"')
    reference: marks tests as requiring external reference sources (deselect with '-m "not reference"')
    llm: marks tests as requiring LLM provider (deselect with '-m "not llm"')
    performance: marks tests as performance benchmarks (deselect with '-m "not performance"')
    external_network: marks tests as requiring external network access (network blocking disabled)
addopts = -m "not performance"
