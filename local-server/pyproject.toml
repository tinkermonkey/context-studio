[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-studio-local-server"
version = "0.1.0"
description = "Local-first knowledge graph application"

[tool.setuptools.packages.find]
include = ["domain*", "adapters*", "utils*"]

[tool.black]
line-length = 100
preview = true
target-version = ['py311']
