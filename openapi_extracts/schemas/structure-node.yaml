$schema: http://json-schema.org/draft-07/schema#
type: object
title: structure-node schemas
description: Combined schemas for structure-node data model
definitions:
  NodeOut:
    properties:
      node_type:
        $ref: '#/components/schemas/NodeTypeEnum'
      parent_node_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Parent Node Id
      title:
        type: string
        maxLength: 255
        minLength: 2
        title: Title
      definition:
        anyOf:
        - type: string
        - type: 'null'
        title: Definition
      structural_predicate_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Structural Predicate Id
      id:
        type: string
        format: uuid
        title: Id
      title_embedding:
        anyOf:
        - items:
            type: number
          type: array
        - type: 'null'
        title: Title Embedding
      definition_embedding:
        anyOf:
        - items:
            type: number
          type: array
        - type: 'null'
        title: Definition Embedding
      created_at:
        type: string
        title: Created At
      version:
        type: integer
        title: Version
      last_modified:
        type: string
        title: Last Modified
    type: object
    required:
    - node_type
    - title
    - id
    - created_at
    - version
    - last_modified
    title: NodeOut
    description: Model for structure_node output/response.
  NodeCreate:
    properties:
      node_type:
        $ref: '#/components/schemas/NodeTypeEnum'
      parent_node_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Parent Node Id
      title:
        type: string
        maxLength: 255
        minLength: 2
        title: Title
      definition:
        anyOf:
        - type: string
        - type: 'null'
        title: Definition
      structural_predicate_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Structural Predicate Id
    type: object
    required:
    - node_type
    - title
    title: NodeCreate
    description: Model for creating a new structure_node.
  NodeUpdate:
    properties:
      title:
        anyOf:
        - type: string
          maxLength: 255
          minLength: 2
        - type: 'null'
        title: Title
      definition:
        anyOf:
        - type: string
        - type: 'null'
        title: Definition
      parent_node_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Parent Node Id
      structural_predicate_id:
        anyOf:
        - type: string
          format: uuid
        - type: 'null'
        title: Structural Predicate Id
    type: object
    title: NodeUpdate
    description: Model for updating an existing structure_node.
