openapi:
  openapi: 3.0.3
  info:
    title: List Flavors
    version: 1.0.0
  paths:
    /api/pipeline-flavors:
      get:
        operationId: list_flavors_api_pipeline_flavors_get
        summary: List Flavors
        description: List all flavors, optionally filtered by pipeline
        parameters:
        - name: pipeline
          in: query
          required: false
          schema:
            anyOf:
            - $ref: '#/components/schemas/PipelineType'
            - type: 'null'
            description: Filter by pipeline type
            title: Pipeline
          description: Filter by pipeline type
        requestBody: null
        responses:
          '200':
            description: Successful Response
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PipelineFlavorListResponse'
          '422':
            description: Validation Error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/HTTPValidationError'
        tags:
        - pipeline-flavors
        - Pipeline Flavors
