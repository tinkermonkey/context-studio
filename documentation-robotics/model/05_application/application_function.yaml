  path: application.applicationfunction.proposal-withdrawal
  spec_node_id: application.applicationfunction
  type: applicationfunction
  layer_id: application
  name: Proposal withdrawal
  description: "ProposalService.withdraw: on an open proposal, rolls back what it
    applied (the revert path: RevertService, decisions superseded), marks its
    undecided operations withdrawn, sets the proposal withdrawn, and records a
    supersedes link from the proposal named as its replacement, if any. Refused
    when the rollback conflicts, with the blockers."
