# Key libraries and dependencies for Context Studio
# Organized by functional category

# ===== Database Libraries =====

SQLAlchemyORM:
  name: SQLAlchemy ORM
  description: Python SQL toolkit and Object-Relational Mapping library with comprehensive database abstraction
  id: sqlalchemy-orm
  type: library
  version: "2.0.41"
  platform: python-runtime
  category: database
  criticality: critical
  capabilities:
    - ORM for object-relational mapping
    - Core SQL expression language
    - Connection pooling
    - Transaction management
    - Database migration support
    - Multi-database support
  used_by:
    - node-service
    - predicate-service
    - dataset-manager
    - reference-service
    - rag-pipeline-service
    - llm-service

SQLiteVecExtension:
  name: SQLite Vec Extension
  description: Vector search extension for SQLite enabling semantic similarity search with embeddings
  id: sqlite-vec-extension
  type: library
  version: "0.1.6"
  platform: python-runtime
  category: database
  criticality: critical
  capabilities:
    - Vector similarity search
    - Embedding storage
    - Cosine similarity queries
    - Index optimization
  used_by:
    - predicate-similarity-service
    - rag-pipeline-service
    - reference-service

DuckDBPython:
  name: DuckDB Python Library
  description: In-process analytical database for OLAP workloads with native Parquet support
  id: duckdb-python
  type: library
  version: "1.1.0"
  platform: python-runtime
  category: database
  criticality: high
  capabilities:
    - OLAP analytical queries
    - Native Parquet file reading/writing
    - SQL analytics on DataFrames
    - Parallel query execution
    - Arrow integration
  used_by:
    - duckdb-service
    - s3-sync-manager
    - change-analytics-engine

