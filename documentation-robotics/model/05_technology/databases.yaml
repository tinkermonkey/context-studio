# Database technologies for Context Studio
# Core database systems and storage engines

SQLiteDatabase:
  name: SQLite Database Engine
  description: Self-contained, serverless SQL database engine with ACID compliance and vector search extensions
  id: sqlite-database
  type: database
  version: "3.x"
  criticality: critical
  capabilities:
    - ACID compliance
    - Zero-configuration
    - Serverless architecture
    - Cross-platform compatibility
    - Full-text search
    - Vector search (via sqlite-vec extension)
    - Single-file database format
    - Concurrent read access
  extensions:
    - sqlite-vec: "0.1.6 - Vector similarity search"
  stores:
    - local-database
    - operations-database
    - reference-database
    - reference-api-cache-database
  used_by:
    - node-service
    - predicate-service
    - graph-service
    - dataset-manager
    - reference-service
    - rag-pipeline-service
    - llm-service
    - pipeline-flavor-service
    - s3-sync-manager
  platform: python-runtime

DuckDBAnalytics:
  name: DuckDB Analytics Database
  description: In-process analytical SQL database optimized for OLAP workloads with native Parquet support and fast aggregations
  id: duckdb-analytics
  type: database
  version: "1.1.0"
  criticality: high
  capabilities:
    - OLAP analytical queries
    - Native Parquet reading/writing
    - Parallel query execution
    - SQL analytics on DataFrames
    - Arrow integration
    - Push-down optimizations
    - Window functions
    - Aggregate functions
  formats:
    - Parquet: "Native columnar format"
    - CSV: "Text format with automatic type inference"
    - JSON: "Semi-structured data support"
    - Arrow: "Zero-copy integration"
  used_by:
    - duckdb-service
    - s3-sync-manager
    - change-analytics-engine
    - duckdb-query-optimizer
  platform: python-runtime

LocalWorkspaceDatabase:
  name: Local Workspace Database (local.db)
  description: Primary SQLite database for user workspace containing knowledge graph structure, nodes, links, and change tracking
  id: local-database
  type: database-instance
  engine: sqlite-database
  criticality: critical
  file_path: "./data/local.db"
  tables:
    - structure_nodes
    - structure_node_links
    - predicates
    - change_events
    - layers
    - domains
    - terms
  capabilities:
    - Knowledge graph storage
    - Hierarchical structure management
    - Predicate definitions
    - Change event tracking
    - Version control data
  used_by:
    - node-service
    - predicate-service
    - graph-service
    - dataset-manager
    - version-manager
    - working-tree-manager

ReferenceDatabase:
  name: Reference Knowledge Database (reference.db)
  description: SQLite database containing consolidated reference data from ConceptNet, DBpedia, Wikidata, and other external knowledge sources
  id: reference-database
  type: database-instance
  engine: sqlite-database
  criticality: high
  file_path: "./data/reference.db"
  tables:
    - reference_nodes
    - reference_links
    - external_mappings
    - concept_embeddings
  capabilities:
    - Multi-source knowledge consolidation
    - External entity linking
    - Semantic similarity search
    - Cross-source entity resolution
  used_by:
    - reference-service
    - reference-link-service
    - rag-pipeline-service
    - predicate-similarity-service

ReferenceAPICacheDatabase:
  name: Reference API Cache Database (reference_api_cache.db)
  description: SQLite database caching API responses from external reference sources to improve performance and reduce API calls
  id: reference-api-cache-database
  type: database-instance
  engine: sqlite-database
  criticality: medium
  file_path: "./data/reference_api_cache.db"
  tables:
    - api_responses
    - cache_metadata
    - rate_limit_tracking
  capabilities:
    - API response caching
    - Rate limit management
    - Cache expiration
    - Performance optimization
  used_by:
    - reference-service

OperationsDatabase:
  name: Operations Database (operations.db)
  description: SQLite database for operational data including LLM pipeline configurations, executions, background tasks, and system audit logs
  id: operations-database
  type: database-instance
  engine: sqlite-database
  criticality: critical
  file_path: "./data/operations.db"
  tables:
    - pipeline_flavors
    - pipeline_flavor_executions
    - llm_traces
    - background_tasks
    - system_audit_logs
    - performance_metrics
  capabilities:
    - LLM pipeline configuration
    - Execution traceability
    - Background task management
    - System audit logging
    - Performance monitoring
  used_by:
    - llm-service
    - pipeline-flavor-service
    - execution-tracker
    - task-manager
    - performance-monitor
    - rag-observability-store
