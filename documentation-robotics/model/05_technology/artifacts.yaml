sqlite-local:
  id: technology.artifact.sqlite-local
  name: Sqlite-local
  type: artifact
  documentation: Primary SQLite database (local.db) storing structure nodes,
    links, and predicates with SQLiteVector extension
sqlite-reference:
  id: technology.artifact.sqlite-reference
  name: Sqlite-reference
  type: artifact
  documentation: Reference database (reference.db) storing consolidated external
    knowledge from ConceptNet, DBpedia, Wikidata, Schema.org
sqlite-operations:
  id: technology.artifact.sqlite-operations
  name: Sqlite-operations
  type: artifact
  documentation: Operations database (operations.db) for pipeline flavors,
    executions, tasks, and audit logs
local-workstation-zone:
  id: local-workstation-zone
  name: Local Workstation Zone
  type: artifact
  documentation: Local workstation trust zone (trusted) containing SQLite
    databases and local application services
external-api-zone:
  id: external-api-zone
  name: External API Zone
  type: artifact
  documentation: External API trust zone (untrusted) containing ConceptNet,
    DBpedia, Wikidata, and Schema.org services
llm-provider-zone:
  id: llm-provider-zone
  name: LLM Provider Zone
  type: artifact
  documentation: LLM provider trust zone (semi-trusted) containing OpenAI,
    Anthropic, and other LLM API services
