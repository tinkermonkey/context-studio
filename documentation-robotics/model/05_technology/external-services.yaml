# External service integrations for Context Studio
# Third-party services and APIs that Context Studio integrates with

# ===== Cloud Storage Services =====

AWSS3Storage:
  name: AWS S3 Storage Service
  description: Amazon S3 cloud object storage for dataset synchronization, backup, and collaboration through Parquet-based remote sync
  id: aws-s3-storage
  type: external-service
  category: cloud-storage
  criticality: high
  capabilities:
    - Object storage
    - Dataset synchronization
    - Parquet file storage
    - Incremental sync
    - Versioning
    - Access control
  integration:
    library: boto3
    version: "1.40.49"
    protocol: REST API
  data_format:
    - Parquet: "Columnar format for efficient storage and querying"
    - DuckDB exports: "Analytics-ready format"
  used_by:
    - s3-sync-manager
    - s3-storage-optimizer
    - incremental-sync-engine
    - changeset-manager

# ===== Knowledge Graph Services =====

DBpediaKnowledgeBase:
  name: DBpedia Knowledge Base
  description: Structured knowledge extracted from Wikipedia providing entity data, relationships, and ontology for semantic enrichment
  id: dbpedia-knowledge-base
  type: external-service
  category: knowledge-graph
  criticality: medium
  capabilities:
    - Entity lookup
    - SPARQL queries
    - Ontology access
    - Multilingual support
    - Entity linking
    - Property extraction
  integration:
    library: spacy_dbpedia_spotlight
    version: "0.2.6"
    protocol: REST API
    endpoints:
      - "https://api.dbpedia-spotlight.org/en/annotate"
      - "https://dbpedia.org/sparql"
  data_coverage:
    - entities: "6+ million entities"
    - languages: "125+ languages"
    - properties: "2800+ properties"
  used_by:
    - reference-service
    - rag-pipeline-service
    - predicate-service

ConceptNetKnowledgeBase:
  name: ConceptNet Knowledge Base
  description: Multilingual semantic network providing commonsense knowledge, word relationships, and semantic associations
  id: conceptnet-knowledge-base
  type: external-service
  category: knowledge-graph
  criticality: medium
  capabilities:
    - Commonsense reasoning
    - Semantic relations
    - Word similarity
    - Multilingual concepts
    - Concept embeddings
    - Relation extraction
  integration:
    library: concepcy
    version: "git"
    protocol: REST API
    endpoints:
      - "http://api.conceptnet.io/c/"
      - "http://api.conceptnet.io/query"
  data_coverage:
    - concepts: "21 million edges"
    - relations: "36 semantic relations"
    - languages: "30+ languages"
  relation_types:
    - IsA: "Taxonomic relationship"
    - UsedFor: "Purpose relationship"
    - CapableOf: "Ability relationship"
    - PartOf: "Meronymic relationship"
    - HasProperty: "Attribute relationship"
  used_by:
    - reference-service
    - rag-pipeline-service

WikidataKnowledgeBase:
  name: Wikidata Knowledge Base
  description: Free collaborative knowledge base with structured data about entities, properties, and relationships across all knowledge domains
  id: wikidata-knowledge-base
  type: external-service
  category: knowledge-graph
  criticality: medium
  capabilities:
    - Entity data access
    - SPARQL queries
    - Property lookup
    - Multilingual labels
    - Linked data
    - Authority control
  integration:
    library: reference-api-buddy
    version: "0.5.0"
    protocol: REST API + SPARQL
    endpoints:
      - "https://www.wikidata.org/w/api.php"
      - "https://query.wikidata.org/sparql"
  data_coverage:
    - items: "100+ million items"
    - properties: "10,000+ properties"
    - languages: "All languages"
    - statements: "1.5+ billion statements"
  used_by:
    - reference-service
    - predicate-service

SchemaOrgOntology:
  name: Schema.org Ontology
  description: Collaborative vocabulary for structured data markup on web pages providing standardized entity types and properties
  id: schema-org-ontology
  type: external-service
  category: ontology
  criticality: medium
  capabilities:
    - Type definitions
    - Property definitions
    - Hierarchical ontology
    - Web markup standards
    - Semantic search optimization
  integration:
    library: rdflib
    version: "7.1.4"
    protocol: RDF/RDFS
    endpoints:
      - "https://schema.org/version/latest/schemaorg-current-https.jsonld"
  data_coverage:
    - types: "800+ types"
    - properties: "1,400+ properties"
    - domains: "General knowledge, ecommerce, health, events, etc."
  used_by:
    - reference-service
    - predicate-service

# ===== LLM Provider Services =====

OpenAIAPI:
  name: OpenAI API Service
  description: OpenAI language model API providing GPT-4 and GPT-3.5 models for natural language understanding, generation, and reasoning
  id: openai-api
  type: external-service
  category: llm-provider
  criticality: high
  capabilities:
    - Text generation
    - Chat completion
    - Embeddings generation
    - Function calling
    - Streaming responses
    - Token management
  integration:
    library: langchain-openai
    version: "0.3.0"
    protocol: REST API
    endpoints:
      - "https://api.openai.com/v1/chat/completions"
      - "https://api.openai.com/v1/embeddings"
  models:
    - gpt-4: "Most capable model for complex reasoning"
    - gpt-4-turbo: "Faster GPT-4 variant"
    - gpt-3.5-turbo: "Fast and efficient for simpler tasks"
    - text-embedding-3-large: "Advanced embedding model"
  pricing:
    unit: "per 1K tokens"
    model_dependent: true
  used_by:
    - llm-service
    - pipeline-flavor-service
    - rag-pipeline-service
    - execution-tracker

AnthropicAPI:
  name: Anthropic API Service
  description: Anthropic Claude AI models for advanced reasoning, analysis, and long-context understanding
  id: anthropic-api
  type: external-service
  category: llm-provider
  criticality: medium
  capabilities:
    - Text generation
    - Long context processing
    - Analysis and reasoning
    - Code generation
    - Structured outputs
  integration:
    library: langchain-anthropic
    protocol: REST API
    endpoints:
      - "https://api.anthropic.com/v1/messages"
  models:
    - claude-3-opus: "Most capable Claude model"
    - claude-3-sonnet: "Balanced performance and speed"
    - claude-3-haiku: "Fastest Claude model"
  context_window:
    - "Up to 200K tokens"
  used_by:
    - llm-service
    - pipeline-flavor-service

HuggingFaceHub:
  name: Hugging Face Model Hub
  description: Repository of pre-trained models for NLP, vision, and multimodal tasks with transformers library integration
  id: huggingface-hub
  type: external-service
  category: ml-models
  criticality: medium
  capabilities:
    - Pre-trained model access
    - Model fine-tuning
    - Inference API
    - Dataset access
    - Model versioning
  integration:
    library: huggingface-hub
    version: "0.33.2"
    protocol: REST API + Git LFS
    endpoints:
      - "https://huggingface.co/api"
      - "https://api-inference.huggingface.co"
  model_types:
    - sentence-transformers: "Embedding models"
    - text-generation: "LLMs"
    - ner: "Named entity recognition"
    - classification: "Text classification"
  used_by:
    - sentence-transformers
    - spacy-nlp
    - rag-pipeline-service

# ===== NLP Services =====

DBpediaSpotlight:
  name: DBpedia Spotlight Service
  description: Entity linking service for annotating text with DBpedia entities for semantic enrichment
  id: dbpedia-spotlight
  type: external-service
  category: nlp-service
  criticality: medium
  capabilities:
    - Entity recognition
    - Entity linking
    - Confidence scoring
    - Multi-language support
    - Contextual disambiguation
  integration:
    library: spacy-dbpedia-spotlight
    version: "0.2.6"
    protocol: REST API
    endpoints:
      - "https://api.dbpedia-spotlight.org/en/annotate"
      - "https://api.dbpedia-spotlight.org/en/spot"
      - "https://api.dbpedia-spotlight.org/en/candidates"
  languages:
    - English: "Primary support"
    - German: "Full support"
    - French: "Full support"
    - Spanish: "Full support"
    - Others: "20+ languages"
  used_by:
    - reference-service
    - rag-pipeline-service

WordNetLexicalDatabase:
  name: WordNet Lexical Database
  description: Large lexical database of English grouping words into synonym sets (synsets) with semantic relations
  id: wordnet-lexical-database
  type: external-service
  category: lexical-resource
  criticality: medium
  capabilities:
    - Synset lookup
    - Semantic relations
    - Word sense disambiguation
    - Hypernym/hyponym hierarchies
    - Antonyms and meronyms
  integration:
    library: spacy-wordnet
    version: "0.1.0"
    protocol: Local database
  data_coverage:
    - synsets: "117,000+ synsets"
    - word_senses: "155,000+ word-sense pairs"
    - relations: "Multiple semantic relation types"
  used_by:
    - word-sense-service
    - rag-pipeline-service
