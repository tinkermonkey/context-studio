data-store.accesspattern.entity-by-parent-range-scan:
  id: 6bd0d8ba-47a0-432d-a412-c43ba9a98ea6
  path: data-store.accesspattern.entity-by-parent-range-scan
  spec_node_id: data-store.accesspattern
  type: accesspattern
  layer_id: data-store
  name: entity_by_parent RANGE_SCAN
  description: Range scan access pattern for retrieving all ontology entities with
    a specific parent_entity_id — supports hierarchy traversal in the Ontology
    Management bounded context
  attributes:
    patternType: RANGE_SCAN
    targetCollection: ontology_entities
    keyCondition: parent_entity_id = :parent_id
    expectedFrequency: FREQUENT
    consistencyRequirement: STRONG
  source_reference:
    provenance: extracted
    locations:
      - file: local-server/adapters/persistence/sqlite/models.py
        symbol: OntologyEntityModel.parent_entity_id
