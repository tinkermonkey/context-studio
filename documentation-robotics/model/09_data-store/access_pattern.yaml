  spec_node_id: data-store.accesspattern
  type: accesspattern
  layer_id: data-store
  name: vector_similarity_search
  description: Vector similarity search access pattern using SQLiteVector cosine
    similarity — retrieves top-k semantically similar ontology entities by
    embedding
  attributes:
    patternType: VECTOR_SIMILARITY
    targetCollection: ontology_entities
    keyCondition: embedding_vector ANN :query_vector
    expectedFrequency: FREQUENT
    consistencyRequirement: EVENTUAL
