data-store.validationrule.entity-cascade-delete:
  id: 25d3d241-5296-4413-ac83-b2fb4eaa7c29
  path: data-store.validationrule.entity-cascade-delete
  spec_node_id: data-store.validationrule
  type: validationrule
  layer_id: data-store
  name: entity_cascade_delete
  description: Foreign key cascade delete rule on parent_entity_id in
    ontology_entities — deleting a parent Taxonomy or ConceptScheme cascades to
    child entities
  attributes:
    ruleType: FOREIGN_KEY
    targetFields: parent_entity_id
    referencedCollection: ontology_entities
    referencedFields: id
    onDelete: CASCADE
    onUpdate: NO_ACTION
    enforcement: STRICT
  source_reference:
    provenance: extracted
    locations:
      - file: local-server/adapters/persistence/sqlite/models.py
        symbol: OntologyEntity.taxonomy_id
  metadata:
    created_at: 2026-03-24T09:25:09.792Z
    updated_at: 2026-03-24T09:25:09.792Z
    version: 1
