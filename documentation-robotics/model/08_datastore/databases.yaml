# Datastore Layer - Physical Databases and Tables
# These represent the actual database instances and table implementations

LocalDatabase:
  name: Local Database
  description: Primary user workspace database (local.db) containing knowledge graph structure, predicates, collaboration features, and change tracking. SQLite with SQLiteVector extension for semantic search
  id: local-database
  technology: SQLite 3.x with SQLiteVector
  location: ./local.db
  purpose: User workspace data storage
  criticality: critical

ReferenceDatabase:
  name: Reference Database
  description: Multi-source knowledge graph database (reference.db) containing consolidated reference data from ConceptNet, DBpedia, Wikidata, and Schema.org. Optimized for semantic lookups
  id: reference-database
  technology: SQLite 3.x with SQLiteVector
  location: ./reference.db
  purpose: External knowledge source integration
  criticality: high

ReferenceAPICacheDatabase:
  name: Reference API Cache Database
  description: Cache database (reference_api_cache.db) for storing API responses from external reference sources to reduce API calls and improve performance
  id: reference-api-cache-database
  technology: SQLite 3.x
  location: ./reference_api_cache.db
  purpose: API response caching
  criticality: medium

OperationsDatabase:
  name: Operations Database
  description: Operational database (operations.db) for pipeline configurations, execution tracking, background task management, and system operational logs
  id: operations-database
  technology: SQLite 3.x
  location: ./operations.db
  purpose: System operations and pipeline management
  criticality: high
