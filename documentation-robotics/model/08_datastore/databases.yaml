Sqlite-local:
  name: Sqlite-local
  description: Primary user workspace database with structure nodes, predicates, links,
    and change tracking
  criticality: high
  type: sqlite
  id: datastore.database.sqlite-local
  version: 1.0.0
  database:
    filename: local.db
    name: local.db
    type: SQLite
    schemas:
    - name: main
      tables: []
Sqlite-operations:
  name: Sqlite-operations
