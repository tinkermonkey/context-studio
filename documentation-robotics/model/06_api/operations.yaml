  name: ListDatasets
  type: operation
  documentation: GET /api/datasets - List all datasets with metadata
SwitchDataset:
  id: api.operation.SwitchDataset
  name: SwitchDataset
  type: operation
  documentation: POST /api/datasets/{dataset_id}/activate - Switch to a different dataset
