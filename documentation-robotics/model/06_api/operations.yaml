CreateStructureNode:
  id: api.operation.CreateStructureNode
  name: CreateStructureNode
  type: operation
  documentation: POST /api/structure_nodes - Create a new structure node with type validation
ListStructureNodes:
  id: api.operation.ListStructureNodes
  name: ListStructureNodes
  type: operation
  documentation: GET /api/structure_nodes - List structure nodes with filtering and pagination
GetStructureNode:
  id: api.operation.GetStructureNode
  name: GetStructureNode
  type: operation
  documentation: GET /api/structure_nodes/{node_id} - Get a specific structure node by ID
UpdateStructureNode:
  id: api.operation.UpdateStructureNode
  name: UpdateStructureNode
  type: operation
  documentation: PUT /api/structure_nodes/{node_id} - Update a structure node with
    circular reference validation
DeleteStructureNode:
  id: api.operation.DeleteStructureNode
  name: DeleteStructureNode
  type: operation
  documentation: DELETE /api/structure_nodes/{node_id} - Delete a structure node
    and its children
SearchStructureNodes:
  id: api.operation.SearchStructureNodes
  name: SearchStructureNodes
  type: operation
  documentation: POST /api/structure_nodes/find - Vector similarity search across
    structure nodes
CreateNodeLink:
  id: api.operation.CreateNodeLink
  name: CreateNodeLink
  type: operation
  documentation: POST /api/structure_nodes/links - Create a relationship between
    structure nodes
ListNodeLinks:
  id: api.operation.ListNodeLinks
  name: ListNodeLinks
  type: operation
  documentation: GET /api/structure_nodes/links - List structure node links with filtering
CreatePredicate:
  id: api.operation.CreatePredicate
  name: CreatePredicate
  type: operation
  documentation: POST /api/predicates - Create a new semantic predicate
ListPredicates:
  id: api.operation.ListPredicates
  name: ListPredicates
  type: operation
  documentation: GET /api/predicates - List predicates with pagination and sorting
FindSimilarPredicates:
  id: api.operation.FindSimilarPredicates
  name: FindSimilarPredicates
  type: operation
  documentation: POST /api/predicates/{id}/find-similar - Find similar external
    predicates using vector similarity
GraphQuery:
  id: api.operation.GraphQuery
  name: GraphQuery
  type: operation
  documentation: POST /graph/sparql/query - Execute SPARQL queries against the knowledge graph
GraphStats:
  id: api.operation.GraphStats
  name: GraphStats
  type: operation
  documentation: GET /graph/stats - Get comprehensive graph statistics from SPARQL
    and NetworkX
RagExtract:
  id: api.operation.RagExtract
  name: RagExtract
  type: operation
  documentation: POST /api/rag/extract - Extract entities from text using
    four-layer RAG pipeline
RagGetTrace:
  id: api.operation.RagGetTrace
  name: RagGetTrace
  type: operation
  documentation: GET /api/rag/trace/{request_id} - Retrieve RAG pipeline trace
    data for debugging
ReferenceSearch:
  id: api.operation.ReferenceSearch
  name: ReferenceSearch
  type: operation
  documentation: GET /api/reference/{source}/search - Search external knowledge sources
CreatePipelineFlavor:
  id: api.operation.CreatePipelineFlavor
  name: CreatePipelineFlavor
  type: operation
  documentation: POST /api/pipeline-flavors - Create a new LLM pipeline configuration
ListPipelineFlavors:
