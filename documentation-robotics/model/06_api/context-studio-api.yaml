ContextStudioAPI:
  openapi: 3.0.3
  info:
    title: Context Studio API
    description: |
      REST API for Context Studio, a local-first knowledge graph application.
      Provides endpoints for managing structure nodes, graph operations, RAG pipelines,
      collaboration features, and reference data integration.
    version: 1.0.0
    contact:
      name: Context Studio
  servers:
    - url: http://localhost:8000
      description: Local development server
    - url: http://localhost:8000/api
      description: API base path

  x-service-tier: service

  paths:
    # Structure Nodes Operations
    /api/structure_nodes:
      post:
        summary: Create Structure Node
        description: Create new structure node (layer, domain, or term) with type-specific validation
        operationId: create-structure-node
        x-archimate-ref: application.service.node-service.node-service
        tags:
          - Structure Nodes
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_type:
                    type: string
                    enum: [layer, domain, term]
                  title:
                    type: string
                  parent_node_id:
                    type: string
                    format: uuid
        responses:
          '201':
            description: Structure node created successfully
          '422':
            description: Validation error
      get:
        summary: List Structure Nodes
        description: List structure nodes with filtering, pagination, and sorting
        operationId: list-structure-nodes
        x-archimate-ref: application.service.node-service.node-service
        tags:
          - Structure Nodes
        parameters:
          - name: node_type
            in: query
            schema:
              type: string
              enum: [layer, domain, term]
          - name: skip
            in: query
            schema:
              type: integer
              default: 0
          - name: limit
            in: query
            schema:
              type: integer
              default: 100
        responses:
          '200':
            description: List of structure nodes

    /api/structure_nodes/{node_id}:
      get:
        summary: Get Structure Node
        description: Retrieve specific structure node by ID
        operationId: get-structure-node
        x-archimate-ref: application.service.node-service.node-service
        tags:
          - Structure Nodes
        parameters:
          - name: node_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Structure node details
          '404':
            description: Node not found
      put:
        summary: Update Structure Node
        description: Update structure node with circular reference validation
        operationId: update-structure-node
        x-archimate-ref: application.service.node-service.node-service
        tags:
          - Structure Nodes
        parameters:
          - name: node_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
        responses:
          '200':
            description: Node updated successfully
          '404':
            description: Node not found
      delete:
        summary: Delete Structure Node
        description: Delete structure node and cascade to children
        operationId: delete-structure-node
        x-archimate-ref: application.service.node-service.node-service
        tags:
          - Structure Nodes
        parameters:
          - name: node_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '204':
            description: Node deleted successfully
          '404':
            description: Node not found

    /api/structure_nodes/find:
      post:
        summary: Search Structure Nodes
        description: Vector similarity search across structure nodes
        operationId: search-structure-nodes
        x-archimate-ref: application.service.node-service.node-service
        tags:
          - Structure Nodes
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  limit:
                    type: integer
        responses:
          '200':
            description: Search results

    # Node Links Operations
    /api/structure_nodes/links:
      post:
        summary: Create Node Link
        description: Create semantic link between structure nodes
        operationId: create-node-link
        x-archimate-ref: application.service.node-link-service.node-link-service
        tags:
          - Node Links
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_node_id:
                    type: string
                    format: uuid
                  target_node_id:
                    type: string
                    format: uuid
                  predicate_id:
                    type: string
                    format: uuid
        responses:
          '201':
            description: Link created successfully
      get:
        summary: List Node Links
        description: List node links with filtering
        operationId: list-node-links
        x-archimate-ref: application.service.node-link-service.node-link-service
        tags:
          - Node Links
        parameters:
          - name: source_node_id
            in: query
            schema:
              type: string
              format: uuid
          - name: target_node_id
            in: query
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: List of node links

    /api/structure_nodes/links/{link_id}:
      put:
        summary: Update Node Link
        description: Update node link predicate
        operationId: update-node-link
        x-archimate-ref: application.service.node-link-service.node-link-service
        tags:
          - Node Links
        parameters:
          - name: link_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
        responses:
          '200':
            description: Link updated successfully
      delete:
        summary: Delete Node Link
        description: Remove semantic link
        operationId: delete-node-link
        x-archimate-ref: application.service.node-link-service.node-link-service
        tags:
          - Node Links
        parameters:
          - name: link_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '204':
            description: Link deleted successfully

    # Graph Operations
    /api/graph/stats:
      get:
        summary: Get Graph Statistics
        description: Retrieve comprehensive graph statistics from SPARQL and NetworkX
        operationId: get-graph-stats
        x-archimate-ref: application.service.graph-service.graph-service
        tags:
          - Graph
        responses:
          '200':
            description: Graph statistics

    /api/graph/refresh:
      post:
        summary: Refresh Graph
        description: Refresh SPARQL and NetworkX graphs from database
        operationId: refresh-graph
        x-archimate-ref: application.service.graph-service.graph-service
        tags:
          - Graph
        responses:
          '200':
            description: Graph refreshed successfully

    /api/graph/sparql/query:
      post:
        summary: Execute SPARQL Query
        description: Execute SPARQL query against RDF graph
        operationId: execute-sparql-query
        x-archimate-ref: application.service.graph-service.graph-service
        tags:
          - Graph
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
        responses:
          '200':
            description: Query results

    /api/graph/sparql/export:
      get:
        summary: Export RDF
        description: Export RDF graph in various formats
        operationId: export-rdf
        x-archimate-ref: application.service.graph-service.graph-service
        tags:
          - Graph
        parameters:
          - name: format
            in: query
            schema:
              type: string
              enum: [xml, n3, turtle, nt, json-ld]
        responses:
          '200':
            description: RDF export

    /api/graph/analytics/centrality:
      post:
        summary: Calculate Node Centrality
        description: Calculate node centrality using NetworkX algorithms
        operationId: calculate-centrality
        x-archimate-ref: application.service.graph-service.graph-service
        tags:
          - Graph Analytics
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  algorithm:
                    type: string
                    enum: [degree, betweenness, closeness, eigenvector]
        responses:
          '200':
            description: Centrality metrics

    /api/graph/analytics/communities:
      get:
        summary: Detect Graph Communities
        description: Detect communities using NetworkX algorithms
        operationId: detect-communities
        x-archimate-ref: application.service.graph-service.graph-service
        tags:
          - Graph Analytics
        responses:
          '200':
            description: Community detection results

    /api/graph/path/shortest:
      post:
        summary: Find Shortest Path
        description: Find shortest path between two nodes
        operationId: find-shortest-path
        x-archimate-ref: application.service.graph-service.graph-service
        tags:
          - Graph Analytics
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_id:
                    type: string
                    format: uuid
                  target_id:
                    type: string
                    format: uuid
        responses:
          '200':
            description: Shortest path

    # Dataset Operations
    /api/datasets:
      get:
        summary: List Datasets
        description: List all datasets with metrics and active status
        operationId: list-datasets
        x-archimate-ref: dataset-manager
        tags:
          - Datasets
        responses:
          '200':
            description: List of datasets
      post:
        summary: Create Dataset
        description: Create new dataset with unique title and filename
        operationId: create-dataset
        x-archimate-ref: dataset-manager
        tags:
          - Datasets
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  filename:
                    type: string
        responses:
          '201':
            description: Dataset created successfully

    /api/datasets/{dataset_id}/activate:
      post:
        summary: Activate Dataset
        description: Switch to specified dataset
        operationId: activate-dataset
        x-archimate-ref: dataset-manager
        tags:
          - Datasets
        parameters:
          - name: dataset_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Dataset activated successfully

    # Predicate Operations
    /api/predicates:
      post:
        summary: Create Predicate
        description: Create semantic predicate with optional external mappings
        operationId: create-predicate
        x-archimate-ref: predicate-service
        tags:
          - Predicates
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  definition:
                    type: string
                  mapping:
                    type: object
        responses:
          '201':
            description: Predicate created successfully
      get:
        summary: List Predicates
        description: List predicates with pagination and sorting
        operationId: list-predicates
        x-archimate-ref: predicate-service
        tags:
          - Predicates
        parameters:
          - name: skip
            in: query
            schema:
              type: integer
          - name: limit
            in: query
            schema:
              type: integer
        responses:
          '200':
            description: List of predicates

    /api/predicates/{id}:
      put:
        summary: Update Predicate
        description: Update predicate with mapping validation
        operationId: update-predicate
        x-archimate-ref: predicate-service
        tags:
          - Predicates
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
        responses:
          '200':
            description: Predicate updated successfully
      delete:
        summary: Delete Predicate
        description: Delete predicate with usage check
        operationId: delete-predicate
        x-archimate-ref: predicate-service
        tags:
          - Predicates
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '204':
            description: Predicate deleted successfully

    /api/predicates/external/search:
      get:
        summary: Search External Predicates
        description: Vector similarity search for external predicates
        operationId: search-external-predicates
        x-archimate-ref: predicate-similarity-service
        tags:
          - Predicates
        parameters:
          - name: query
            in: query
            required: true
            schema:
              type: string
        responses:
          '200':
            description: Search results

    /api/predicates/{id}/find-similar:
      post:
        summary: Find Similar Predicates
        description: Find similar external predicates using vector similarity
        operationId: find-similar-predicates
        x-archimate-ref: predicate-similarity-service
        tags:
          - Predicates
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Similar predicates

    /api/predicates/cluster-predicates:
      post:
        summary: Cluster Predicates
        description: Cluster predicates using DBSCAN algorithm
        operationId: cluster-predicates
        x-archimate-ref: predicate-similarity-service
        tags:
          - Predicates
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
        responses:
          '200':
            description: Clustering results

    /api/predicates/discover:
      post:
        summary: Discover External Predicates
        description: Background task to discover predicates from external sources
        operationId: discover-external-predicates
        x-archimate-ref: predicate-service
        tags:
          - Predicates
        responses:
          '202':
            description: Discovery task started

    # RAG Pipeline Operations
    /api/rag/extract:
      post:
        summary: RAG Extract Entities
        description: Extract entities using multi-layer RAG pipeline
        operationId: rag-extract-entities
        x-archimate-ref: rag-pipeline-service
        tags:
          - RAG Pipeline
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  context:
                    type: object
        responses:
          '200':
            description: Extracted entities

    /api/rag/metrics/{request_id}:
      get:
        summary: Get RAG Metrics
        description: Retrieve metrics for RAG execution
        operationId: get-rag-metrics
        x-archimate-ref: rag-observability-store
        tags:
          - RAG Pipeline
        parameters:
          - name: request_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: RAG execution metrics

    # Version Management Operations
    /api/versions/entities/{entity_type}/{entity_id}/versions:
      get:
        summary: Get Entity Versions
        description: Retrieve version history for an entity
        operationId: get-entity-versions
        x-archimate-ref: version-manager
        tags:
          - Version Management
        parameters:
          - name: entity_type
            in: path
            required: true
            schema:
              type: string
          - name: entity_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Version history

    /api/versions/entities/{entity_type}/{entity_id}/rollback:
      post:
        summary: Rollback Entity
        description: Rollback entity to specific version
        operationId: rollback-entity
        x-archimate-ref: version-manager
        tags:
          - Version Management
        parameters:
          - name: entity_type
            in: path
            required: true
            schema:
              type: string
          - name: entity_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  version_number:
                    type: integer
        responses:
          '200':
            description: Entity rolled back successfully

    /api/versions/working-tree/status:
      get:
        summary: Get Working Tree Status
        description: Git-inspired working tree status
        operationId: get-working-tree-status
        x-archimate-ref: working-tree-manager
        tags:
          - Version Management
        responses:
          '200':
            description: Working tree status

    /api/versions/working-tree/commit:
      post:
        summary: Commit Working Changes
        description: Commit staged changes with message
        operationId: commit-working-changes
        x-archimate-ref: working-tree-manager
        tags:
          - Version Management
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        responses:
          '200':
            description: Changes committed successfully

    # Conflict Resolution Operations
    /api/conflicts:
      get:
        summary: List Conflicts
        description: List all conflicts with filtering
        operationId: list-conflicts
        x-archimate-ref: conflict-resolution-engine
        tags:
          - Conflict Resolution
        responses:
          '200':
            description: List of conflicts

    /api/conflicts/{conflict_id}/resolve:
      post:
        summary: Resolve Conflict
        description: Manually resolve conflict with chosen strategy
        operationId: resolve-conflict
        x-archimate-ref: conflict-resolution-engine
        tags:
          - Conflict Resolution
        parameters:
          - name: conflict_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy:
                    type: string
                    enum: [ours, theirs, manual]
        responses:
          '200':
            description: Conflict resolved

    /api/conflicts/{conflict_id}/auto-resolve:
      post:
        summary: Auto Resolve Conflict
        description: Attempt automatic conflict resolution
        operationId: auto-resolve-conflict
        x-archimate-ref: conflict-resolution-engine
        tags:
          - Conflict Resolution
        parameters:
          - name: conflict_id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Conflict auto-resolved

    # Synchronization Operations
    /api/sync/push:
      post:
        summary: Sync to Remote
        description: Push local changes to S3 remote
        operationId: sync-to-remote
        x-archimate-ref: s3-sync-manager
        tags:
          - Synchronization
        responses:
          '200':
            description: Sync completed successfully

    /api/sync/pull:
      post:
        summary: Sync from Remote
        description: Pull changes from S3 remote
        operationId: sync-from-remote
        x-archimate-ref: s3-sync-manager
        tags:
          - Synchronization
        responses:
          '200':
            description: Sync completed successfully

    # System Operations
    /health:
      get:
        summary: Get System Health
        description: Health check endpoint for system status
        operationId: get-system-health
        tags:
          - System
        responses:
          '200':
            description: System healthy
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: string

  components:
    schemas:
      Error:
        type: object
        properties:
          message:
            type: string
          code:
            type: string

  tags:
    - name: Structure Nodes
      description: Operations for managing layers, domains, and terms
    - name: Node Links
      description: Operations for managing semantic relationships
    - name: Graph
      description: Graph querying and SPARQL operations
    - name: Graph Analytics
      description: NetworkX analytics and graph algorithms
    - name: Datasets
      description: Dataset management and switching
    - name: Predicates
      description: Semantic predicate management
    - name: RAG Pipeline
      description: RAG entity extraction and metrics
    - name: Version Management
      description: Entity versioning and working tree
    - name: Conflict Resolution
      description: Collaboration conflict management
    - name: Synchronization
      description: Remote synchronization operations
    - name: System
      description: System health and monitoring
