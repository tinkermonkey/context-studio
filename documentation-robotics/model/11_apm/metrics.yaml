ApiLatency:
  id: apm.metric.ApiLatency
  name: ApiLatency
  description: Measures the latency of API operations.
  measures-goal:
  - motivation.goal.enable-knowledge-graph-curation
  - motivation.goal.support-rag-workflows
  - motivation.goal.facilitate-human-agent-communication
  - motivation.goal.ensure-local-first-operation
  - motivation.goal.enable-collaborative-sync
  version: 1.0.0
  application: context-studio
  tracing:
    serviceName: context-studio
    sampler:
      type: always_on
    propagators:
    - w3c-trace-context
    exporters:
    - type: console
      endpoint: stdout
  logging:
    serviceName: context-studio
    logLevel: INFO
    exporters:
    - type: console
      endpoint: stdout
  metrics:
    serviceName: context-studio
    meters:
    - name: api-metrics
      instruments:
      - name: ApiLatency
        type: histogram
        unit: ms
        description: Measures the latency of API operations.
    exporters:
    - type: console
      endpoint: stdout
  instruments:
  - api.operation.CreateStructureNode
  - api.operation.ListStructureNodes
  - api.operation.GetStructureNode
  - api.operation.UpdateStructureNode
  - api.operation.DeleteStructureNode
  - api.operation.SearchStructureNodes
  - api.operation.CreateNodeLink
  - api.operation.ListNodeLinks
  - api.operation.CreatePredicate
  - api.operation.ListPredicates
  - api.operation.FindSimilarPredicates
  - api.operation.GraphQuery
  - api.operation.GraphStats
  - api.operation.RagExtract
  - api.operation.RagGetTrace
  - api.operation.ReferenceSearch
  - api.operation.CreatePipelineFlavor
  - api.operation.ListPipelineFlavors
  - api.operation.ListDatasets
  - api.operation.SwitchDataset
