  spec_node_id: testing.testcasesketch
  type: testcasesketch
  layer_id: testing
  name: Pre-review verdicts reach the proposal visibly
  description: "Unit, fake extraction service (TestPreReview in
    test_single_call_orchestrator.py): with no or a disabled pre_review setting
    nothing is reviewed; with one, a retype changes the individual's class and a
    split replaces it by its parts before relating, unsure changes nothing, the
    counts and tokens reach the run's metadata; a failed review keeps the
    individuals and the run."
