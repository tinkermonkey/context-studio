  id: 1abadfe8-4c59-4282-be82-3440ab61b955
  path: testing.testcasesketch.an-edited-end-names-an-element-by-its-ref
  spec_node_id: testing.testcasesketch
  type: testcasesketch
  layer_id: testing
  name: An Edited End Names An Element By Its Ref
  description: "A relationship create accepted with an end changed to another
    element of the proposal, named by its $ref: it fails unresolved_ref until
    that element applies, then applies with the end resolved and records the ref
    in applied_fields."
