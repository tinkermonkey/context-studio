  name: Not An Element Opens The Reason Step
  description: Pressing Not an element (or X) on an awaiting element highlights
    the reasons with a prompt and focuses the first reason; in gold mode with an
    empty note it focuses the note and shows the Write why message. Nothing is
    sent until a reason is picked.
