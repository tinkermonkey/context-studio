  spec_node_id: testing.testcasesketch
  type: testcasesketch
  layer_id: testing
  name: End Search Finds A Pending Element And Reverse Swaps The Ends
  description: On a fresh extraction (nothing applied, an empty dataset), a
    relationship's source search lists this proposal's awaiting elements, the
    pick waits for that element to apply, and Reverse swaps the ends, offering
    the predicates the reversed direction allows.
  attributes:
    status: automated
    implementationFormat: automated
  source_reference:
