Local Data Access Policy:
  name: Local Data Access Policy
  description: Local data access policy allowing unrestricted access to local SQLite
    databases as application runs on user-controlled workstation
  criticality: medium
  id: local-data-access-policy
  version: '1.0'
  application: App
  authentication:
    provider: api-key
    sessionTimeout: 60
    mfaRequired: false
  roles:
  - name: user
    displayName: User
  resources:
  - resource: '*'
    type: data
    operations:
    - operation: access
  dataClassification:
    classifications:
    - level: internal
      label: Legacy Classification
      description: Legacy data converted from CIA format
      encryption: none
      retention:
        period: indefinite
        deleteAfter: false
        reviewRequired: false
      accessControl: role-based
      auditLevel: standard
      masking: none
