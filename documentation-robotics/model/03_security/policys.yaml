local-data-access-policy:
  id: local-data-access-policy
  name: Local Data Access Policy
  type: policy
  documentation: Local data access policy allowing unrestricted access to local
    SQLite databases as application runs on user-controlled workstation
https-requirement-policy:
  id: https-requirement-policy
  name: HTTPS Requirement Policy
  type: policy
  documentation: HTTPS requirement for external API connections to ConceptNet,
    DBpedia, Wikidata, and Schema.org reference sources
llm-api-key-policy:
  id: llm-api-key-policy
  name: LLM API Key Policy
  type: policy
  documentation: LLM API key management policy for secure storage of OpenAI,
    Anthropic, and other provider credentials in config.json
data-integrity-policy:
  id: data-integrity-policy
  name: Data Integrity Policy
  type: policy
  documentation: Data integrity policy ensuring atomic database transactions,
    rollback on errors, and comprehensive change event tracking
reference-source-validation-policy:
  id: reference-source-validation-policy
  name: Reference Source Validation Policy
  type: policy
  documentation: External reference source validation policy for HTTPS enforcement
    and secure upstream URL configuration
