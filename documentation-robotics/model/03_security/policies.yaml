# Security Policies for Context Studio
# Defines security principles, requirements, and enforcement mechanisms

DataSovereigntyPolicy:
  name: Data Sovereignty Policy
  description: All user knowledge and data must remain under user control with local-first storage, optional cloud sync only with explicit user consent
  id: data-sovereignty-policy
  type: policy
  criticality: critical
  enforcement: design
  applies_to:
    - dataset-manager
    - working-tree-manager
    - s3-sync-manager
  requirements:
    - Local SQLite storage by default
    - No mandatory cloud dependencies
    - User-initiated sync only
    - Transparent data location
  rationale: Context Studio stores proprietary business knowledge that must remain under direct user control without forced cloud exposure

APIKeyProtectionPolicy:
  name: API Key Protection Policy
  description: LLM provider API keys and external service credentials must be securely stored and never logged or exposed in responses
  id: api-key-protection-policy
  type: policy
  criticality: critical
  enforcement: code + configuration
  applies_to:
    - llm-service
    - pipeline-flavor-service
    - reference-service
  requirements:
    - API keys in environment variables or encrypted config
    - No keys in source code or git history
    - Keys never logged
    - Keys never in API responses
    - Secure key rotation support
  rationale: API keys provide billable access to external services and must be protected to prevent unauthorized usage and cost overruns

RateLimitingPolicy:
  name: Rate Limiting Policy
  description: External API calls must be rate-limited to prevent cost overruns and service abuse
  id: rate-limiting-policy
  type: policy
  criticality: high
  enforcement: code
  applies_to:
    - llm-service
    - reference-service
    - rag-pipeline-service
  requirements:
    - Configurable rate limits per service
    - Request queueing and backoff
    - Usage tracking and alerts
    - Cost estimation
  rationale: Unlimited LLM and external API usage can result in unexpected high costs or service throttling

InputValidationPolicy:
  name: Input Validation Policy
  description: All user inputs must be validated and sanitized to prevent injection attacks
  id: input-validation-policy
  type: policy
  criticality: high
  enforcement: code
  applies_to:
    - context-studio-api
    - node-service
    - predicate-service
  requirements:
    - Pydantic validation on all inputs
    - SQL parameterization (no string concatenation)
    - XSS prevention in React components
    - Length limits on text fields
    - Type checking
  rationale: User inputs from knowledge graph editing could contain malicious content attempting SQL injection or XSS attacks

SecureCommunicationPolicy:
  name: Secure Communication Policy
  description: All external API communication must use HTTPS with certificate validation
  id: secure-communication-policy
  type: policy
  criticality: high
  enforcement: configuration
  applies_to:
    - llm-service
    - reference-service
  requirements:
    - HTTPS for all external calls
    - Certificate validation enabled
    - TLS 1.2+ minimum
    - Secure cipher suites
  rationale: External API communication contains sensitive data (knowledge content, API keys) that must be encrypted in transit

CORSPolicy:
  name: CORS Policy
  description: Cross-Origin Resource Sharing must be configured to allow only trusted origins
  id: cors-policy
  type: policy
  criticality: medium
  enforcement: configuration
  applies_to:
    - context-studio-api
  requirements:
    - Configurable allowed origins
    - No wildcard (*) in production
    - Credentials support when needed
    - Preflight handling
  rationale: Desktop app architecture requires CORS configuration to enable React frontend to communicate with local backend

DataRetentionPolicy:
  name: Data Retention Policy
  description: Sensitive data like LLM traces and execution logs must have defined retention periods
  id: data-retention-policy
  type: policy
  criticality: medium
  enforcement: code
  applies_to:
    - execution-tracker
    - rag-observability-store
  requirements:
    - 7-day retention for traces
    - 30-day retention for metrics
    - Automatic cleanup jobs
    - User-configurable retention
  rationale: LLM execution traces can accumulate rapidly and consume storage while containing potentially sensitive knowledge content

DependencySecurityPolicy:
  name: Dependency Security Policy
  description: Third-party dependencies must be regularly scanned and updated for known vulnerabilities
  id: dependency-security-policy
  type: policy
  criticality: medium
  enforcement: process
  applies_to:
    - python-runtime
    - react-runtime
    - tauri-runtime
  requirements:
    - Automated vulnerability scanning
    - Regular dependency updates
    - Security patch process
    - SBOM generation
  rationale: Context Studio relies on numerous third-party packages that may contain security vulnerabilities

SecretsManagementPolicy:
  name: Secrets Management Policy
  description: All secrets and credentials must be stored securely and never committed to version control
  id: secrets-management-policy
  type: policy
  criticality: critical
  enforcement: code + process
  applies_to:
    - llm-service
    - s3-sync-manager
    - reference-service
  requirements:
    - .env files gitignored
    - No hardcoded credentials
    - Environment variable validation
    - Secrets rotation support
    - Example configs without real keys
  rationale: Accidental credential exposure in git history can lead to unauthorized access and cost overruns
