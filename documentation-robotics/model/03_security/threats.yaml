Protect User Data:
  name: Protect User Data
  description: Security requirement to protect user knowledge graph data on local
    workstation from unauthorized access
  criticality: high
  id: protect-user-data
  version: '1.0'
  application: App
  authentication:
    provider: api-key
    sessionTimeout: 60
    mfaRequired: false
  roles:
  - name: user
    displayName: User
  resources:
  - resource: '*'
    type: data
    operations:
    - operation: access
  dataClassification:
    classifications:
    - level: internal
      label: Legacy Classification
      description: Legacy data converted from CIA format
      encryption: none
      retention:
        period: indefinite
        deleteAfter: false
        reviewRequired: false
      accessControl: role-based
      auditLevel: standard
      masking: none
