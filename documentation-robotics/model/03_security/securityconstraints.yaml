sqlite-file-permissions:
  id: sqlite-file-permissions
  name: SQLite File Permissions
  type: securityconstraint
  documentation: SQLite database file permissions restricted to user account
    through OS-level file permissions for local.db, reference.db,
    reference_api_cache.db, and operations.db
https-enforcement:
  id: https-enforcement
  name: HTTPS Enforcement
  type: securityconstraint
  documentation: HTTPS enforcement for external API calls with URL validation in
    ReferenceSourceConfig preventing HTTP URLs
api-key-encryption:
  id: api-key-encryption
  name: API Key Encryption
  type: securityconstraint
  documentation: API key encryption and secure storage in config.json with
    environment variable override support for sensitive credentials
transaction-rollback:
  id: transaction-rollback
  name: Transaction Rollback
  type: securityconstraint
  documentation: Database transaction rollback on errors through SQLAlchemy
    session management ensuring data integrity
input-validation:
  id: input-validation
  name: Input Validation
  type: securityconstraint
  documentation: Pydantic-based input validation for all API requests ensuring
    type safety and preventing malformed data
sql-injection-prevention:
  id: sql-injection-prevention
  name: SQL Injection Prevention
  type: securityconstraint
  documentation: SQL injection prevention through SQLAlchemy ORM parameterized
    queries and proper escaping
change-event-logging:
  id: change-event-logging
  name: Change Event Logging
  type: securityconstraint
  documentation: Comprehensive change event logging for audit trail of all
    database changes across structure_nodes, structure_node_links, and
    predicates
