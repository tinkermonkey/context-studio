SQLite File Permissions:
  name: SQLite File Permissions
  description: SQLite database file permissions restricted to user account through
    OS-level file permissions for local.db, reference.db, reference_api_cache.db,
    and operations.db
  criticality: medium
  id: sqlite-file-permissions
  version: '1.0'
  application: App
  authentication:
    provider: api-key
    sessionTimeout: 60
    mfaRequired: false
  roles:
  - name: user
    displayName: User
  resources:
  - resource: '*'
    type: data
    operations:
    - operation: access
  dataClassification:
    classifications:
    - level: internal
      label: Legacy Classification
      description: Legacy data converted from CIA format
      encryption: none
      retention:
        period: indefinite
        deleteAfter: false
        reviewRequired: false
      accessControl: role-based
      auditLevel: standard
      masking: none
