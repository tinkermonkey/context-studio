ux.actioncomponent.not-an-element-button:
  id: 84275f84-4063-4778-a4bc-1372303bb08d
  path: ux.actioncomponent.not-an-element-button
  spec_node_id: ux.actioncomponent
  type: actioncomponent
  layer_id: ux
  name: Not An Element Button
  description: "The inspector's \"Not an element\" / \"Not a relationship\" button
    (key X). It opens the reason step: scrolls the reasons into view, highlights
    them with \"Pick a reason to reject it\" and focuses the first reason, or in
    gold mode with no note yet, the note field. The rejection is recorded when a
    reason is picked."
  attributes:
    type: button
    label: Not an element
    style: secondary
    channel: web
  source_reference:
    provenance: manual
    locations:
      - file: ux/src/components/proposals/review/ReviewInspector.tsx
        symbol: openReasons
  metadata:
    created_at: 2026-11-24T12:33:48.266Z
    updated_at: 2026-11-24T12:33:48.266Z
    version: 1
