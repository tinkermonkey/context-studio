ux.actioncomponent.revert-control:
  id: f6839d02-8f13-4a8b-a7a8-03802a782d21
  path: ux.actioncomponent.revert-control
  spec_node_id: ux.actioncomponent
  type: actioncomponent
  layer_id: ux
  name: Revert Control
  description: "Header control: 'Revert proposal' while unlanded (its dialog's
    confirm calls the in-place revert), 'Propose the reversal…' once landed (its
    dialog's confirm creates the reversal proposal); hidden while a reversal is
    open. Reads the landing state from the proposal."
  attributes:
    type: button
    label: Revert proposal / Propose the reversal…
    style: danger
  source_reference:
    provenance: manual
    locations:
      - file: ux/src/components/proposals/RevertControl.tsx
        symbol: RevertControl
  metadata:
    created_at: 2026-11-19T17:00:51.603Z
