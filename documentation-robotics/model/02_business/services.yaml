KnowledgeGraphService:
  id: business.service.KnowledgeGraphService
  name: Knowledge Graph Service
  type: service
  documentation: Business service for knowledge graph operations including CRUD
    operations on layers, domains, terms, and relationships
SemanticSearchService:
  id: business.service.SemanticSearchService
  name: Semantic Search Service
  type: service
  documentation: Business service for semantic search operations using vector
    embeddings and similarity algorithms
RagService:
  id: business.service.RagService
  name: RAG Service
  type: service
  documentation: Business service for RAG workflows including context retrieval
    and LLM integration
ReferenceService:
  id: business.service.ReferenceService
  name: Reference Service
  type: service
  documentation: Business service for external reference integration with
    ConceptNet, DBpedia, Wikidata, and Schema.org
NlpService:
  id: business.service.NlpService
  name: NLP Service
  type: service
  documentation: Business service for text processing including entity
    recognition, embedding generation, and linguistic analysis
