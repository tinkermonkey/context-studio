KnowledgeGraphCuration:
  name: Knowledge Graph Curation
  description: Create, manage, and curate hierarchical knowledge structures with layers, domains, and terms for organizing domain knowledge with semantic relationships and predicate-based linking
  id: knowledge-graph-curation
  type: capability
  criticality: critical
  business_value: Enables users to build structured, reusable knowledge assets that form the foundation for AI-powered applications, semantic search, and intelligent knowledge management
  realized_by:
    - node-service
    - graph-service
    - node-link-service
    - predicate-service
  supports:
    - knowledge-asset-management

AIContentProcessing:
  name: AI-Powered Content Processing
  description: Apply natural language processing, entity extraction, and semantic analysis to text content using spaCy, LangChain, and configurable LLM pipelines for automated knowledge discovery
  id: ai-content-processing
  type: capability
  criticality: high
  business_value: Automates knowledge extraction and enrichment from unstructured text, reducing manual curation effort by 80% and enabling rapid knowledge base population
  realized_by:
    - rag-pipeline-service
    - llm-service
    - word-sense-service
  supports:
    - ai-knowledge-processing
    - knowledge-enrichment

DatasetWorkspaceManagement:
