knowledge-curation-process:
  id: knowledge-curation-process
  name: Knowledge Curation Process
  type: process
  documentation: Process for curating knowledge graph content including creating
    layers, domains, terms, and establishing semantic relationships
rag-query-process:
  id: rag-query-process
  name: RAG Query Process
  type: process
  documentation: Process for executing RAG queries with context retrieval,
    embedding search, and LLM response generation
dataset-versioning-process:
  id: dataset-versioning-process
  name: Dataset Versioning Process
  type: process
  documentation: Process for managing dataset versions including creation,
    switching, and synchronization operations
semantic-enrichment-process:
  id: semantic-enrichment-process
  name: Semantic Enrichment Process
  type: process
  documentation: Process for enriching entities with NLP analysis including entity
    recognition, embedding generation, and linguistic features
reference-linking-process:
  id: reference-linking-process
  name: Reference Linking Process
  type: process
  documentation: Process for linking terms to external references including
    search, disambiguation, and integration with ConceptNet, DBpedia, and
    Wikidata
