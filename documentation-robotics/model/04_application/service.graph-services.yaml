GraphService:
  name: GraphService
  description: Provides unified graph operations combining SPARQL querying and NetworkX
    analytics for knowledge graph traversal and analysis
  criticality: critical
  id: application.service.graph-service.graph-service
  exposes:
    - get-graph-stats
    - refresh-graph
    - execute-sparql-query
    - export-rdf
    - calculate-centrality
    - detect-communities
    - find-shortest-path
  accesses:
    - structure-node-schema
    - structure-node-link-schema
    - predicate-schema
