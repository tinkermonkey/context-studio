StructureNodeManagement:
  id: application.service.StructureNodeManagement
  name: Structure-node-management
  type: service
  documentation: Manages the lifecycle of structure nodes (terms, concepts) in the
    knowledge graph.
NodeLinkManagement:
  id: application.service.NodeLinkManagement
  name: Node-link-management
  type: service
  documentation: Manages relationships between structure nodes with semantic
    predicates and type validation
PredicateManagement:
  id: application.service.PredicateManagement
  name: Predicate-management
  type: service
  documentation: Manages semantic predicates with ConceptNet integration and ontology mappings
GraphAnalytics:
  id: application.service.GraphAnalytics
  name: Graph-analytics
  type: service
  documentation: Provides SPARQL queries and NetworkX graph analytics including
    centrality and community detection.
EmbeddingGeneration:
  id: application.service.EmbeddingGeneration
  name: Embedding-generation
  type: service
  documentation: Generates and manages vector embeddings for semantic search
    across structure nodes
RagPipeline:
  id: application.service.RagPipeline
  name: Rag-pipeline
  type: service
  documentation: Four-layer RAG pipeline for entity extraction with KG context,
    LLM processing, spaCy gap analysis, and concept resolution.
ReferenceIntegration:
  id: application.service.ReferenceIntegration
  name: Reference-integration
  type: service
  documentation: Integrates external knowledge sources including ConceptNet,
    DBpedia, Wikidata, and Schema.org.
PipelineFlavorManagement:
  id: application.service.PipelineFlavorManagement
  name: Pipeline-flavor-management
  type: service
  documentation: Manages LLM pipeline configurations with provider settings,
    prompts, and version control.
NlpAnalysis:
  id: application.service.NlpAnalysis
  name: Nlp-analysis
  type: service
  documentation: Provides NLP capabilities including word sense disambiguation,
    token analysis, and text processing.
ChangeEventTracking:
  id: application.service.ChangeEventTracking
  name: Change-event-tracking
  type: service
  documentation: Tracks and audits all changes to structure nodes, links, and
    predicates with event processing.
ReferenceLinkManagement:
  id: application.service.ReferenceLinkManagement
  name: Reference-link-management
  type: service
  documentation: Manages links between structure nodes and external knowledge
    sources with validation
WordSenseManagement:
  id: application.service.WordSenseManagement
  name: Word-sense-management
  type: service
  documentation: Manages word sense associations from WordNet and NLP analysis for
    structure nodes
DatasetManagement:
  id: application.service.DatasetManagement
  name: Dataset-management
  type: service
  documentation: Manages multiple datasets with switching, history tracking, and DuckDB sync.
SyncManagement:
  id: application.service.SyncManagement
  name: Sync-management
  type: service
  documentation: Handles incremental sync with remote storage using DuckDB and Parquet files
PredicateSimilarity:
  id: application.service.PredicateSimilarity
  name: Predicate-similarity
  type: service
  documentation: Performs vector similarity search and clustering for predicate
    discovery and mapping
