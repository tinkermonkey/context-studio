structure-node-details:
  id: application.component.structure-node-details
  name: Structure-node-details
  type: component
  documentation: Displays detailed information for layers, domains, and terms with
    hierarchy navigation
node-tables:
  id: application.component.node-tables
  name: Node-tables
  type: component
  documentation: Data tables for listing and managing structure nodes with
    pagination and filtering
tree-chart:
  id: application.component.tree-chart
  name: Tree-chart
  type: component
  documentation: Hierarchical tree visualization for knowledge graph structure
    with interactive navigation
predicate-mapping-manager:
  id: application.component.predicate-mapping-manager
  name: Predicate-mapping-manager
  type: component
  documentation: Interface for managing predicate mappings to external ontologies
    with similarity search
reference-viewer:
  id: application.component.reference-viewer
  name: Reference-viewer
  type: component
  documentation: Browser for external knowledge sources with graph visualization
    and link exploration
rag-test-interface:
  id: application.component.rag-test-interface
  name: Rag-test-interface
  type: component
  documentation: Testing interface for RAG pipeline with trace visualization and
    performance metrics
nlp-analysis-panel:
  id: application.component.nlp-analysis-panel
  name: Nlp-analysis-panel
  type: component
  documentation: NLP analysis interface with word sense selection and token visualization
pipeline-flavor-editor:
  id: application.component.pipeline-flavor-editor
  name: Pipeline-flavor-editor
  type: component
  documentation: Editor for LLM pipeline configurations with prompt management and
    model selection
dataset-manager:
  id: application.component.dataset-manager
  name: Dataset-manager
  type: component
  documentation: Interface for managing multiple datasets with switching and history tracking
node-selectors:
  id: application.component.node-selectors
  name: Node-selectors
  type: component
  documentation: Reusable selector components for layers, domains, terms, and predicates
application-logs:
  id: application-logs
  name: Application Logs
  type: component
  documentation: Application log events with color-coded severity levels (DEBUG,
    INFO, WARNING, ERROR, CRITICAL) written to console and daily rotated log
    files with 5-day retention
dataset-action-log:
  id: dataset-action-log
  name: Dataset Action Log
  type: component
  documentation: Dataset operation action log in structured JSON format capturing
    create, update, delete, and sync operations
llm-token-usage:
  id: llm-token-usage
  name: LLM Token Usage
  type: component
  documentation: LLM token usage metrics for cost tracking across OpenAI,
    Anthropic, and other providers via pipeline_flavor_executions table
rag-pipeline-performance:
  id: rag-pipeline-performance
  name: RAG Pipeline Performance
  type: component
  documentation: RAG pipeline execution performance metrics tracking layer
    execution times and success rates
api-response-times:
  id: api-response-times
  name: API Response Times
  type: component
  documentation: API endpoint response time metrics tracked via
    AccessLogMiddleware with status-based logging levels
database-query-performance:
  id: database-query-performance
  name: Database Query Performance
  type: component
  documentation: Database query performance metrics for SQLite operations across
    local.db, reference.db, and operations.db
embedding-generation-time:
  id: embedding-generation-time
  name: Embedding Generation Time
  type: component
  documentation: Embedding generation time metrics for title and definition
    embeddings using sentence transformers
change-event-volume:
  id: change-event-volume
  name: Change Event Volume
  type: component
  documentation: Change event volume metrics tracking activity across
    structure_nodes, structure_node_links, and predicates for audit trail
