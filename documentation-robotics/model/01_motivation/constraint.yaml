motivation.constraint.sqlite-only-persistence:
  id: e1c60608-6395-4e89-8019-6ee2c20446c9
  path: motivation.constraint.sqlite-only-persistence
  spec_node_id: motivation.constraint
  type: constraint
  layer_id: motivation
  name: SQLite-Only Persistence
  description: "SQLite files only: local.db for the workspace, operations.db for
    pipeline runs, executions and chat, plus the droppable caches
    reference_api_cache.db and reference.db. Vector similarity is brute-force
    numpy cosine over embeddings stored in SQLite, not the SQLiteVector
    extension. S3/DuckDB sync is an optional export, not a store."
  attributes:
    constraintType: technical
  source_reference:
    provenance: extracted
    locations:
      - file: local-server/adapters/persistence/sqlite/models.py
  metadata:
    created_at: 2026-03-24T09:20:49.338Z
    updated_at: 2026-03-24T09:20:49.338Z
    version: 1
motivation.constraint.external-reference-source-rate-limits:
  id: a43eb63f-e655-48db-8bb0-bd1c1ac9b986
  path: motivation.constraint.external-reference-source-rate-limits
  spec_node_id: motivation.constraint
  type: constraint
  layer_id: motivation
  name: External Reference Source Rate Limits
  description: "The built-in caching proxy (reference-api-buddy) enforces
    per-upstream limits: requests_per_hour for each source in config.json
    reference.proxy.sources (ConceptNet, DBpedia, Wikidata, and Wikipedia pages
    fetched as sources), with responses cached for 168 h."
  attributes:
    constraintType: external
  source_reference:
    provenance: manual
    locations:
      - file: local-server/adapters/reference/proxy.py
  metadata:
    created_at: 2026-03-24T09:20:49.947Z
    updated_at: 2026-03-24T09:20:49.947Z
    version: 1
motivation.constraint.configuration-only-through-the-config-file:
  id: 5e5809f0-45f5-4c02-8c7a-e3d1d1f70305
  path: motivation.constraint.configuration-only-through-the-config-file
  spec_node_id: motivation.constraint
  type: constraint
  layer_id: motivation
  name: Configuration Only Through the Config File
  description: Settings live in config.json (or the file CONFIG_PATH names); no
    environment overrides of app settings. The LLM key environment fallback is a
    development convenience and is never written back.
  attributes:
    constraintType: technical
  source_reference:
    provenance: manual
    locations:
      - file: CLAUDE.md
  metadata:
    created_at: 2026-11-19T16:14:23.186Z
    updated_at: 2026-11-19T16:14:23.186Z
    version: 1
motivation.constraint.loopback-only-deployment:
  id: 6d66f806-1e82-4950-92e9-3f1e913b2209
  path: motivation.constraint.loopback-only-deployment
  spec_node_id: motivation.constraint
  type: constraint
  layer_id: motivation
  name: Loopback-Only Deployment
  description: The server binds 127.0.0.1 by default and MCP refuses to start on a
    non-loopback host; remote access is out of scope.
  attributes:
    constraintType: technical
  source_reference:
    provenance: manual
    locations:
      - file: README.md
  metadata:
    created_at: 2026-11-19T16:14:23.186Z
    updated_at: 2026-11-19T16:14:23.186Z
    version: 1
motivation.constraint.external-llm-provider-required:
  id: 9be80690-c775-4f4b-9b2a-f50c68715fc1
  path: motivation.constraint.external-llm-provider-required
  spec_node_id: motivation.constraint
  type: constraint
  layer_id: motivation
  name: External LLM Provider Required
  description: Extraction, chat and refinement need an Anthropic, OpenAI or
    OpenRouter key (decision models optionally Cloudflare Workers AI); the
    default extraction costs about $0.7-1.5 per document.
  attributes:
    constraintType: external
  source_reference:
