desktop-deployment:
  id: desktop-deployment
  name: Desktop Deployment
  type: constraint
  documentation: Must operate as desktop application on user workstations without
    requiring server infrastructure
sqlite-database-limitation:
  id: sqlite-database-limitation
  name: SQLite Database Limitation
  type: constraint
  documentation: Limited to SQLite database capabilities for portability and
    simplicity, constraining scale and concurrency
offline-operation-requirement:
  id: offline-operation-requirement
  name: Offline Operation Requirement
  type: constraint
  documentation: Must function fully offline without internet connectivity for
    privacy and availability
llm-provider-dependency:
  id: llm-provider-dependency
  name: LLM Provider Dependency
  type: constraint
  documentation: Depends on external LLM providers for AI features, requiring API
    keys and network access when AI features are used
local-compute-constraints:
  id: local-compute-constraints
  name: Local Compute Constraints
  type: constraint
  documentation: Limited by local machine compute resources for embedding
    generation and NLP processing
