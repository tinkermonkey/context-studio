motivation.assessment.splits-and-retypes-are-half-of-reviewer-changes:
  id: 2c70a84a-685c-4f98-b4a4-a28096a97531
  path: motivation.assessment.splits-and-retypes-are-half-of-reviewer-changes
  spec_node_id: motivation.assessment
  type: assessment
  layer_id: motivation
  name: Splits and Retypes Are Half of Reviewer Changes
  description: "Gate D (2026-11-21, one take per document, one reviewer): 15 of
    the 29 rejections and retypes the person made on two real documents came
    down to two questions: one item or several (4 House nodes naming two or
    three tools or kits) and the better class (11 retypes, 5 on the DR viewer
    README). The DR document had no splits; its other 5 rejections were 'not an
    element' (dependencies or facts stated as elements). Only DR's half reflects
    real use. Source:
    documentation/extraction/experiments/2026-11-21-gate-d-real-documents.md and
    the Gate D reading in rearchitecture/ontology_workbench_proposal.md (PR
    tinkermonkey/context-studio#1675, branch claude/gate-d-value-log)."
  attributes:
    assessmentType: gap
  metadata:
    created_at: 2026-11-22T14:48:01.245Z
    updated_at: 2026-11-22T14:48:01.245Z
    version: 1
