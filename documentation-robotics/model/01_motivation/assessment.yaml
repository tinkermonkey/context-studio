motivation.assessment.security-posture-assessment:
  id: 4f9d4a07-3032-4128-a410-57ea3b1213b9
  path: motivation.assessment.security-posture-assessment
  spec_node_id: motivation.assessment
  type: assessment
  layer_id: motivation
  name: Security Posture Assessment
  description: "Single-user, loopback-only posture. The REST API has no login, so
    anything that can reach the port can read and change the workspace.
    RequestGuard refuses foreign Origin and non-loopback Host headers. MCP needs
    a bearer token and starts only on loopback. Agent writes are proposals.
    Gaps, tracked as requirements to fix: the Vite dev server exposes /api
    (including the MCP token endpoint) to the LAN (#1655), and URL sources have
    no private-address (SSRF) check (#1656). Source text and ontology content go
    to external LLM providers."
  attributes:
    assessmentType: gap
  source_reference:
    provenance: manual
    locations:
      - file: README.md
  metadata:
    created_at: 2026-03-24T09:21:11.216Z
    updated_at: 2026-03-24T09:21:11.216Z
    version: 1
