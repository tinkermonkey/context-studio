motivation.requirement.secrets-stay-in-the-configuration-file:
  id: 2308da43-9ade-4c9d-9263-aa391d219481
  path: motivation.requirement.secrets-stay-in-the-configuration-file
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
