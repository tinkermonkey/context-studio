  path: motivation.requirement.contexts-depend-on-each-other-only-through-public-contracts
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Contexts depend on each other only through public contracts
  description: A bounded context may depend on another context's ports, entities, value objects, exceptions, public functions and the public methods of its application service, which is injected at the composition root and never constructed. It never touches another context's adapters or private (_) members, and never shares state through ambient globals. scripts/check_domain_imports.py checks it (#1633).
  attributes:
    requirementType: non-functional
    priority: high
  metadata:
    created_at: 2026-11-24T12:27:23.116Z
