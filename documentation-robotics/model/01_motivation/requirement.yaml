motivation.requirement.pre-review-is-adopted-only-by-a-rule-set-in-advance:
  id: dac63203-d159-46aa-b5f3-952ec5cdfebc
  path: motivation.requirement.pre-review-is-adopted-only-by-a-rule-set-in-advance
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Pre-Review Is Adopted Only by a Rule Set in Advance
  description: "The pre-review stage stays off by default until a decision rule
    written on its experiment page before the first paid run adopts it: it must
    cut the reviewer's split and retype changes without losing typed F1,
    measured over three paired takes on human-checked gold, with its own
    changes' precision and its false-change rate on correct elements bounded."
  attributes:
    requirementType: quality
    priority: high
  metadata:
    created_at: 2026-11-22T14:48:01.260Z
    updated_at: 2026-11-22T14:48:01.260Z
    version: 1
