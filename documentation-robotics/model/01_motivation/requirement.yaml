motivation.requirement.dev-server-not-reachable-from-the-lan:
  id: 04d3b841-aff4-4cf2-986e-a37754cf48e5
  path: motivation.requirement.dev-server-not-reachable-from-the-lan
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Dev Server Not Reachable from the LAN
  description: The Vite dev server must not expose /api (including the endpoint
    that returns the MCP token) to other machines on the network. Met by binding
    to loopback (#1655).
  attributes:
    requirementType: non-functional
    priority: high
    documentation: "To fix: tinkermonkey/context-studio#1655 (LAN exposure via the
      Vite dev server)."
  source_reference:
    provenance: manual
    locations:
      - file: README.md
  metadata:
    created_at: 2026-11-19T16:14:23.186Z
    updated_at: 2026-11-19T16:14:23.186Z
    version: 1
motivation.requirement.url-sources-refuse-private-network-addresses:
  id: 76e3ac0a-91b3-442d-ac94-b97c93064e3a
  path: motivation.requirement.url-sources-refuse-private-network-addresses
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: URL Sources Refuse Private Network Addresses
  description: Adding a URL source must refuse private, loopback and link-local
    addresses, including after redirects, so the server cannot be used to reach
    internal services (SSRF). Met by the connect-time address check (#1656);
    sources.allow_private_urls is the explicit exception.
  attributes:
    requirementType: non-functional
    priority: high
    documentation: "To fix: tinkermonkey/context-studio#1656 (SSRF via URL sources)."
  source_reference:
    provenance: manual
    locations:
      - file: local-server/domain/extraction/sources.py
  metadata:
    created_at: 2026-11-19T16:14:23.186Z
    updated_at: 2026-11-19T16:14:23.186Z
    version: 1
