motivation.requirement.a-long-text-field-is-proposed-as-anchored-edits:
  id: db319609-d4b0-4b80-bc58-25ddd8df3732
  path: motivation.requirement.a-long-text-field-is-proposed-as-anchored-edits
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: A long text field is proposed as anchored edits
  description: "#1630: a client changes part of a description or a taxonomy vision by edits anchored on the existing text (insert after an anchor, replace an anchor, delete an anchor), applied in order, instead of resending the whole value. The proposal is refused if an anchor is missing or appears more than once. Adding one bullet to a 7,000-character vision takes one short edit."
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-25T02:12:36.072Z
    updated_at: 2026-11-25T02:12:36.072Z
    version: 1
motivation.requirement.an-anchored-edit-applies-to-the-current-text-or-goes-stale:
  id: dff4108c-8b71-4253-ab99-9b18b2998787
  path: motivation.requirement.an-anchored-edit-applies-to-the-current-text-or-goes-stale
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: An anchored edit applies to the current text or goes stale
  description: "#1630: at accept, an operation's edits are applied again to the field's text as it is then, so another change made since the proposal is kept. If an anchor no longer matches, the operation is stale (with the anchor named) instead of overwriting the text. No lost update."
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-25T02:12:36.073Z
    updated_at: 2026-11-25T02:12:36.073Z
    version: 1
