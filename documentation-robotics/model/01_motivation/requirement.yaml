  path: motivation.requirement.reason-codes-for-every-reject
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Reason Codes for Every Reject
  description: Every reject, of any operation kind and in bulk, takes one reason code from a single set (not_in_text, mentioned_only, too_generic, duplicate, out_of_scope, incorrect, keep_current, outdated, other) plus an optional note (required only for a gold element). Buttons are filtered by operation kind; outdated leads when the operation is stale. System rejections keep their text and no code.
  attributes:
    requirementType: functional
    priority: high
    documentation: "Owner decision 1. Three new codes: incorrect, keep_current, outdated. No migration: reason_code is String(20)."
  source_reference:
    provenance: manual
    locations:
      - file: local-server/domain/versioning/proposals.py
        symbol: RejectionReason
  accepted_gaps:
    - direction: outgoing
      predicate: realizes
      other_spec_node_id: motivation.principle
      reason: It serves the goal Every Decision Becomes Data (realized directly), not a standing principle.
      decided_by: agent
      decided_at: 2026-11-19T17:02:51.359Z
      changeset: changeset-1795107225483-xwgktrnaj
  metadata:
    created_at: 2026-11-19T16:59:05.121Z
    updated_at: 2026-11-19T16:59:05.121Z
    version: 1
