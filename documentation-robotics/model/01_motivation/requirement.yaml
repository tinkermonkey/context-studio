motivation.requirement.breaking-changes-never-auto-apply:
  id: b9f351db-f277-47b3-99b5-659d7378234d
  path: motivation.requirement.breaking-changes-never-auto-apply
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Breaking Changes Never Auto-Apply
  description: Breaking operations (deletes included), taxonomy creates, vision
    edits and extraction operations without a source passage are never applied
    by an approval policy.
