motivation.requirement.pre-review-is-adopted-only-by-a-rule-set-in-advance:
  id: dac63203-d159-46aa-b5f3-952ec5cdfebc
  path: motivation.requirement.pre-review-is-adopted-only-by-a-rule-set-in-advance
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Pre-Review Is Adopted Only by a Rule Set in Advance
  description: "The pre-review stage stays off by default until a decision rule
    written on its experiment page before the first paid run adopts it: it must
    cut the reviewer's split and retype changes without losing typed F1,
    measured over three paired takes on human-checked gold, with its own
    changes' precision and its false-change rate on correct elements bounded."
  attributes:
    requirementType: quality
    priority: high
  metadata:
    created_at: 2026-11-22T14:48:01.260Z
    updated_at: 2026-11-22T14:48:01.260Z
    version: 1
motivation.requirement.contexts-depend-on-each-other-only-through-public-contracts:
  id: f8d11f62-4047-47ae-aaeb-62dcec284c7a
  path: motivation.requirement.contexts-depend-on-each-other-only-through-public-contracts
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Contexts depend on each other only through public contracts
  description: A bounded context may depend on another context's ports, entities,
    value objects, exceptions, public functions and the public methods of its
    application service, which is injected at the composition root and never
    constructed. It never touches another context's adapters or private (_)
    members, and never shares state through ambient globals.
    scripts/check_domain_imports.py checks it (#1633).
  attributes:
    requirementType: non-functional
    priority: high
  metadata:
    created_at: 2026-11-24T12:27:23.116Z
    updated_at: 2026-11-24T12:27:23.116Z
    version: 1
motivation.requirement.unlanded-lists-only-proposals-with-something-to-land:
  id: 3d3ac48e-88e2-4ae1-93c0-f14bbd470d7a
  path: motivation.requirement.unlanded-lists-only-proposals-with-something-to-land
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Unlanded lists only proposals with something to land
  description: "#1634: landed=false (REST and MCP alike) lists only proposals that
    have applied operations a client can land in its source: never one whose
    operations were all rejected or reverted, never a re-import (source bundle),
    never one about a dataset (dataset_id set)."
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-24T12:34:33.367Z
    updated_at: 2026-11-24T12:34:33.367Z
    version: 1
motivation.requirement.the-proposals-list-filters-in-the-query-and-has-a-summary-form:
  id: 7fcdcfac-c175-486f-9a37-4f75dd6fa144
  path: motivation.requirement.the-proposals-list-filters-in-the-query-and-has-a-summary-form
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: The proposals list filters in the query and has a summary form
  description: "#1626: GET /api/proposals filters by dataset_id, source_id and
    pipeline_type in the query, with a correct total, and fields=summary returns
    operation counts (by op, kind, status and scope) instead of operations, so
    pages that show counts download no operations."
  attributes:
    requirementType: non-functional
    priority: medium
  metadata:
    created_at: 2026-11-24T12:34:33.368Z
    updated_at: 2026-11-24T12:34:33.368Z
    version: 1
