  criticality: high
  route: /app/layers
  id: ux.view.layers-page
  relationships.uses: application.service.structure-node-management
  version: 1.0.0
domains-page:
  name: domains-page
  description: Domains management page with filterable table and layer-based navigation
  criticality: high
  route: /app/domains
  id: ux.view.domains-page
  relationships.uses: application.service.structure-node-management
  version: 1.0.0
terms-page:
  name: terms-page
  description: Terms management page with domain filtering and semantic predicate
    editing
  criticality: high
  route: /app/terms
  id: ux.view.terms-page
  relationships.uses: application.service.structure-node-management
  version: 1.0.0
predicates-page:
  name: predicates-page
  description: Predicates management page for semantic relationship definitions and
    ConceptNet mappings
  criticality: medium
  route: /app/predicates
  id: ux.view.predicates-page
  relationships.uses: application.service.predicate-management
  version: 1.0.0
datasets-page:
  name: datasets-page
  description: Dataset management page with current dataset card and version history
  criticality: medium
  route: /app/datasets
  id: ux.view.datasets-page
  relationships.uses: application.service.dataset-management
  version: 1.0.0
config-hub-page:
  name: config-hub-page
  description: Configuration hub page with sidebar navigation to system settings
  criticality: medium
  route: /app/config
  id: ux.view.config-hub-page
  version: 1.0.0
pipelines-config-page:
  name: pipelines-config-page
