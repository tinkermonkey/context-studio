home-page:
  name: home-page
  description: Landing/dashboard page with tree chart visualization of knowledge graph
    structure
  criticality: high
  route: /app
  id: ux.view.home-page
  version: 1.0.0
layers-page:
  name: layers-page
  description: Layers management page with hierarchical tree view and CRUD operations
