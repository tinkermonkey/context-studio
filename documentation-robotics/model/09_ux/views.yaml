  criticality: medium
  route: /app/config/data-sources
  id: ux.view.data-sources-config-page
  version: 1.0.0
network-config-page:
  name: network-config-page
  description: Network configuration page for API endpoints and connectivity settings
  criticality: low
  route: /app/config/network
  id: ux.view.network-config-page
  version: 1.0.0
system-config-page:
  name: system-config-page
  description: System configuration page for application settings and preferences
  criticality: low
  route: /app/config/system
  id: ux.view.system-config-page
  version: 1.0.0
