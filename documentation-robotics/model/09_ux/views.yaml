models-config-page:
  name: models-config-page
  description: LLM models configuration page for provider and model settings
  criticality: medium
  route: /app/config/models
  id: ux.view.models-config-page
  version: 1.0.0
data-sources-config-page:
  name: data-sources-config-page
  description: Reference data sources configuration page for ConceptNet, DBpedia,
