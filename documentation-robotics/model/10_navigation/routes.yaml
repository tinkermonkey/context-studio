# Navigation Layer - Application Routes
# Defines the complete route structure and navigation hierarchy

RootRoute:
  name: Root Route
  description: Application root providing theme context and query client
  id: root-route
  path: /
  component: RootComponent
  layout: none
  children:
    - app-route

AppRoute:
  name: App Route
  description: Main application layout with navbar and content area
  id: app-route
  path: /app
  component: AppComponent
  layout: cs_navbar
  landing_page: dashboard-page
  children:
    - dashboard-route
    - knowledge-graph-routes
    - rag-routes
    - reference-routes
    - datasets-route
    - config-routes
    - monitoring-routes

DashboardRoute:
  name: Dashboard Route
  description: Application dashboard and landing page
  id: dashboard-route
  path: /app
  exact: true
  page: dashboard-page
  public: false
  menu_visible: true
  menu_label: Dashboard
  menu_order: 1

