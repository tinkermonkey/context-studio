# Configuration Routes
ConfigIndexRoute:
  name: Configuration Index Route
  description: Configuration section hub
  id: config-index-route
  path: /app/config
  exact: true
  page: configuration-index-page
  public: false
  menu_visible: true
  menu_label: Configuration
  menu_icon: settings
  menu_order: 10

PipelinesIndexRoute:
  name: Pipelines Index Route
  description: Pipeline types overview
  id: pipelines-index-route
  path: /app/config/pipelines
  exact: true
  page: pipeline-flavors-index-page
  public: false
  menu_group: Configuration
  menu_visible: true
  menu_label: Pipeline Flavors
  parent: config-index-route

PipelineTypeRoute:
  name: Pipeline Type Route
  description: List flavors for a specific pipeline type
  id: pipeline-type-route
  path: /app/config/pipelines/:pipelineType
  exact: true
  page: pipeline-flavor-list-page
  public: false
  menu_visible: false
  parameters:
    - pipelineType (suggest_term_definition | suggest_layer_definition | suggest_domain_definition | extract_entities)

PipelineFlavorCreateRoute:
  name: Pipeline Flavor Create Route
  description: Create new pipeline flavor
  id: pipeline-flavor-create-route
  path: /app/config/pipelines/:pipelineType/create
  page: pipeline-flavor-create-page
  public: false
  menu_visible: false

PipelineFlavorEditRoute:
  name: Pipeline Flavor Edit Route
  description: Edit existing pipeline flavor
  id: pipeline-flavor-edit-route
  path: /app/config/pipelines/:pipelineType/edit/:flavorId
  page: pipeline-flavor-edit-page
  public: false
  menu_visible: false
  parameters:
    - pipelineType
    - flavorId (UUID)

PipelineFlavorTestRoute:
  name: Pipeline Flavor Test Route
  description: Test pipeline flavor interactively
  id: pipeline-flavor-test-route
  path: /app/config/pipelines/:pipelineType/test/:flavorId
  page: pipeline-flavor-test-page
  public: false
  menu_visible: false
  parameters:
    - pipelineType
    - flavorId (UUID)

