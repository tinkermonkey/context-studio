# Navigation Layer - User Flows and Journeys
# Defines common user workflows and navigation patterns

KnowledgeGraphManagementFlow:
  name: Knowledge Graph Management Flow
  description: Primary workflow for creating and managing knowledge graph structure
  id: kg-management-flow
  type: workflow
  steps:
    - step: Navigate to Layers page
      route: layers-route
    - step: Create or select layer
      actions:
        - Create new layer (layer-form)
        - Select existing layer
    - step: Navigate to Domains page
      route: domains-route
    - step: Create domains within layer
      actions:
        - Create new domain (domain-form)
        - Define parent layer relationship
    - step: Navigate to Terms page
      route: terms-route
    - step: Create terms within domains
      actions:
        - Create new term (term-form)
        - Define parent domain relationship
    - step: View structure node details
      route: structure-node-detail-route
      actions:
        - View properties
        - View relationships
        - Edit details
  pages:
    - layers-page
    - domains-page
    - terms-page
    - structure-node-detail-page

PredicateCreationFlow:
  name: Predicate Creation and Mapping Flow
  description: Workflow for creating predicates and mapping to external ontologies
  id: predicate-creation-flow
  type: workflow
  steps:
    - step: Navigate to Predicates page
      route: predicates-route
    - step: Create new predicate
      component: predicate-form
      actions:
        - Enter identifier, title, definition
        - Mark relevance
    - step: Navigate to Reference Predicate Mapping
      route: reference-predicate-mapping-route
    - step: Search external predicates
      component: unified-search-widget
      interactions:
        - search-external-predicates
    - step: Find similar predicates
      component: predicate-similarity-service
      interactions:
        - find-similar-predicates
    - step: Map to external predicate
      actions:
        - Select external match
        - Save mapping
  pages:
    - predicates-page
    - reference-predicate-mapping-page

RAGPipelineTestingFlow:
  name: RAG Pipeline Testing Flow
  description: Workflow for testing and comparing RAG pipeline configurations
  id: rag-pipeline-testing-flow
  type: workflow
  steps:
    - step: Navigate to RAG Experiments
      route: rag-experiments-route
    - step: Create test paragraphs
      component: test-paragraph-editor
      actions:
        - Write or import test text
        - Add ground truth annotations
    - step: Run pipeline on test data
      component: pipeline-test-runner
      interactions:
        - rag-extract-entities
    - step: View results
      component: test-results-viewer
      interactions:
        - get-rag-metrics
      actions:
        - Analyze accuracy
        - Compare layers
    - step: Compare pipelines
      route: rag-pipeline-comparison-route
      component: pipeline-comparison-grid
      actions:
        - Select multiple pipelines
        - Run comparative tests
        - Analyze performance differences
  pages:
    - rag-experiments-page
    - rag-pipeline-comparison-page
    - rag-test-runner-page

PipelineFlavorConfigurationFlow:
  name: Pipeline Flavor Configuration Flow
  description: Workflow for creating and testing LLM pipeline flavors
  id: pipeline-flavor-config-flow
  type: workflow
  steps:
    - step: Navigate to Configuration
      route: config-index-route
    - step: Navigate to Pipeline Flavors
      route: pipelines-index-route
    - step: Select pipeline type
      route: pipeline-type-route
      actions:
        - Choose pipeline type (suggest_term_definition, extract_entities, etc.)
    - step: Create new flavor
      route: pipeline-flavor-create-route
      component: pipeline-flavor-form
      actions:
        - Select LLM provider and model
        - Configure parameters (temperature, top_p, max_tokens)
        - Write system and user prompts
    - step: Test flavor
      route: pipeline-flavor-test-route
      component: pipeline-test-form
      interactions:
        - execute-pipeline-flavor
      actions:
        - Run test inputs
        - Review outputs
        - Iterate on prompts
    - step: Enable flavor
      actions:
        - Mark as enabled
        - Set as default (optional)
  pages:
    - configuration-index-page
    - pipeline-flavors-index-page
    - pipeline-flavor-list-page
    - pipeline-flavor-create-page
    - pipeline-flavor-test-page

DatasetSwitchingFlow:
  name: Dataset Switching Flow
  description: Workflow for managing and switching between datasets
  id: dataset-switching-flow
  type: workflow
  steps:
    - step: Navigate to Datasets page
      route: datasets-route
    - step: View available datasets
      component: datasets-table
      interactions:
        - list-datasets
    - step: Create new dataset (optional)
      component: dataset-form
      interactions:
        - create-dataset
      actions:
        - Enter title and filename
        - Initialize schema
    - step: Activate dataset
      interactions:
        - activate-dataset
      actions:
        - Select target dataset
        - Confirm switch
        - Reload application context
    - step: View dataset history
      component: dataset-history
      actions:
        - Review activation timeline
        - Check dataset metrics
  pages:
    - datasets-page

ReferenceSearchFlow:
  name: Reference Search and Integration Flow
  description: Workflow for searching external references and linking to knowledge graph
  id: reference-search-flow
  type: workflow
  steps:
    - step: Navigate to Reference Search
      route: reference-search-route
    - step: Select sources
      component: source-selector
      actions:
        - Enable/disable sources (ConceptNet, DBpedia, Wikidata, Schema.org)
    - step: Enter search query
      component: unified-search-widget
      interactions:
        - search-external-predicates
    - step: Review results
      component: search-results-list
      actions:
        - View definitions
        - Check source indicators
    - step: Link to structure node
      actions:
        - Select matching node
        - Add reference link
  pages:
    - reference-search-page
    - structure-node-detail-page

MonitoringWorkflow:
  name: System Monitoring Workflow
  description: Workflow for monitoring system health and performance
  id: monitoring-workflow
  type: workflow
  steps:
    - step: Navigate to System Health
      route: monitoring-system-health-route
    - step: Check overall health status
      component: health-status-dashboard
      interactions:
        - get-system-health
      actions:
        - Review component status
        - Check database health
        - Verify API connectivity
    - step: Review performance metrics
      route: monitoring-performance-route
      component: performance-charts
      actions:
        - Analyze response times
        - Check throughput
        - Monitor resource usage
    - step: Check LLM execution logs
      route: monitoring-llm-traceability-route
      component: llm-execution-log
      interactions:
        - get-rag-metrics
      actions:
        - Filter by pipeline
        - Review execution details
        - Debug issues
    - step: Monitor background tasks
      route: monitoring-task-manager-route
      component: task-queue-viewer
      actions:
        - View active tasks
        - Check task status
        - Cancel if needed
  pages:
    - monitoring-system-health-page
    - monitoring-performance-page
    - monitoring-llm-traceability-page
    - monitoring-task-manager-page

QuickAccessPatterns:
  name: Quick Access Navigation Patterns
  description: Common quick access patterns for frequent operations
  id: quick-access-patterns
  type: shortcuts
  patterns:
    - pattern: Global search
      trigger: Search input in navbar
      scope: All structure nodes
      action: Navigate to search results

    - pattern: Create new layer
      from: Layers page
      shortcut: Create button
      action: Open layer form modal

    - pattern: Create new domain
      from: Domains page
      shortcut: Create button
      action: Open domain form modal

    - pattern: Create new term
      from: Terms page
      shortcut: Create button
      action: Open term form modal

    - pattern: Quick configuration access
      from: Any page
      trigger: Settings icon in navbar
      action: Open configuration dropdown
      destinations:
        - Configuration home
        - Pipeline flavors
        - Models
        - Data sources
        - Monitoring

    - pattern: Dataset quick switch
      from: Any page
      trigger: Dataset selector in navbar
      action: Activate different dataset
      reload: true

    - pattern: Node detail view
      from: Any table
      trigger: Click row
      action: Navigate to structure-node-detail-route

    - pattern: Inline edit
      from: Table views
      trigger: Edit icon in row
      action: Open form modal for editing

UserJourneyMap:
  name: Complete User Journey Map
  description: High-level map of user journeys through the application
  id: user-journey-map
  type: journey-map
  personas:
    - Knowledge Engineer
    - AI/ML Engineer
    - System Administrator
  journeys:
    - journey: Knowledge Graph Creation
      persona: Knowledge Engineer
      entry_point: dashboard-page
      flows:
        - kg-management-flow
        - predicate-creation-flow

    - journey: RAG Pipeline Optimization
      persona: AI/ML Engineer
      entry_point: dashboard-page
      flows:
        - pipeline-flavor-config-flow
        - rag-pipeline-testing-flow

    - journey: System Configuration and Monitoring
      persona: System Administrator
      entry_point: dashboard-page
      flows:
        - pipeline-flavor-config-flow
        - dataset-switching-flow
        - monitoring-workflow

    - journey: External Reference Integration
      persona: Knowledge Engineer
      entry_point: reference-search-page
      flows:
        - reference-search-flow
        - predicate-creation-flow
