security.authenticationconfig.mcp-bearer-token-authentication:
  id: e32b8812-6833-4339-829f-f401806be197
  path: security.authenticationconfig.mcp-bearer-token-authentication
  spec_node_id: security.authenticationconfig
  type: authenticationconfig
  layer_id: security
  name: MCP Bearer Token Authentication
  description: "Every MCP request must carry Authorization: Bearer with the token
    from config.json mcp.auth_token, compared with hmac.compare_digest. The
    token is generated on first start; rotate it by clearing the value and
    restarting. The REST API itself has no login."
  attributes:
    provider: local
    sessionTimeout: 0
    mfaRequired: false
  source_reference:
    provenance: manual
    locations:
      - file: local-server/adapters/mcp/server.py
