security.countermeasure.origin-and-host-request-guard:
  id: 45b3574a-56ea-41d0-8a91-eef77402cb0b
  path: security.countermeasure.origin-and-host-request-guard
  spec_node_id: security.countermeasure
  type: countermeasure
  layer_id: security
  name: Origin and Host Request Guard
  description: RequestGuard refuses requests with a foreign Origin and, on
    loopback, a non-loopback Host header; the CORS allowlist ignores '*'.
  attributes:
    type: technical
    effectiveness: high
    implemented: true
    description: Origin/Host checks on the REST API
  source_reference:
    provenance: manual
    locations:
