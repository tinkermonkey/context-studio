  path: security.countermeasure.parameterized-queries-via-orm
  spec_node_id: security.countermeasure
  type: countermeasure
  layer_id: security
  name: Parameterized Queries via ORM
  description: SQLAlchemy ORM uses parameterized queries for all database
    operations across all bounded contexts, preventing SQL injection
