security.countermeasure.secret-safe-configuration:
  id: 8abde7a2-27bf-4f75-bde9-afd4daf8860e
  path: security.countermeasure.secret-safe-configuration
  spec_node_id: security.countermeasure
  type: countermeasure
  layer_id: security
  name: Secret-Safe Configuration
  description: config.json is untracked (config.example.json is the template);
    keys derived from the environment are not written back; configuration models
    that may hold credentials hide input values in validation errors. Loading
    sets an invalid value aside with its field named (never its value) and loads
    the rest, rather than discarding the file.
  attributes:
    type: technical
    effectiveness: medium
    implemented: true
    description: Secrets kept out of the repo and out of error messages
  source_reference:
    provenance: manual
    locations:
      - file: local-server/config.py
  metadata:
    created_at: 2026-11-19T16:18:36.733Z
    updated_at: 2026-11-19T16:18:36.733Z
    version: 1
