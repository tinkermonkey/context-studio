security.threat.information-disclosure-via-error-messages:
  id: 13180b9a-297d-4c3d-8426-9549247f1356
  path: security.threat.information-disclosure-via-error-messages
  spec_node_id: security.threat
  type: threat
  layer_id: security
  name: Information Disclosure via Error Messages
  description: "Internal details or secret values leaking through error responses.
    There is no global exception handler: routes map domain exceptions to HTTP
    codes, unhandled errors fall back to FastAPI's plain 500, and configuration
    models that may hold credentials hide input values in validation errors."
  attributes:
    threatens: api
    likelihood: low
    impact: moderate
    description: File path leakage via error responses
    criticality: low
  source_reference:
    provenance: manual
    locations:
      - file: local-server/config.py
  metadata:
    created_at: 2026-03-24T09:17:49.054Z
    updated_at: 2026-03-24T09:17:49.054Z
    version: 1
