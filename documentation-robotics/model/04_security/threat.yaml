security.threat.lan-exposure-via-the-vite-dev-server:
  id: 27eab9a2-e886-4205-8dc9-ad793fe8fcf0
  path: security.threat.lan-exposure-via-the-vite-dev-server
  spec_node_id: security.threat
  type: threat
  layer_id: security
  name: LAN Exposure via the Vite Dev Server
  description: "npm run dev listens on all interfaces and proxies /api, including
    the endpoint that returns the MCP token, so another machine on the network
    can read and change the workspace. Not accepted: to fix under #1655."
  attributes:
    threatens: api
    likelihood: moderate
    impact: high
    criticality: high
    description: Dev server exposes the API and MCP token to the LAN (#1655)
  source_reference:
    provenance: manual
    locations:
      - file: README.md
  accepted_gaps:
    - direction: incoming
      predicate: mitigates
      other_spec_node_id: security.countermeasure
      reason: "Unmitigated today; the fix is tracked as requirement
        dev-server-not-reachable-from-the-lan and GitHub issue #1655. Add the
        countermeasure when that lands."
      decided_by: agent
      decided_at: 2026-11-19T16:36:27.928Z
      changeset: changeset-1795099306929-dmd727eav
  metadata:
    created_at: 2026-11-19T16:18:36.733Z
    updated_at: 2026-11-19T16:18:36.733Z
    version: 1
security.threat.server-side-request-forgery-via-url-sources:
  id: 8e630d6a-17a8-44a7-acc4-f35291bccb71
  path: security.threat.server-side-request-forgery-via-url-sources
  spec_node_id: security.threat
  type: threat
  layer_id: security
  name: Server-Side Request Forgery via URL Sources
  description: "Adding a URL source fetches any http(s) URL and follows redirects
    with no private-address check, so the server can be made to reach internal
    services. Not accepted: to fix under #1656."
  attributes:
    threatens: api
    likelihood: low
    impact: moderate
    criticality: medium
    description: URL sources can reach private addresses (#1656)
  source_reference:
    provenance: manual
    locations:
      - file: local-server/adapters/sources/fetcher.py
  accepted_gaps:
    - direction: incoming
      predicate: mitigates
      other_spec_node_id: security.countermeasure
      reason: "Unmitigated today (check_url checks the scheme only); the fix is
        tracked as requirement url-sources-refuse-private-network-addresses and
        GitHub issue #1656."
      decided_by: agent
      decided_at: 2026-11-19T16:36:30.945Z
      changeset: changeset-1795099306929-dmd727eav
    - direction: outgoing
      predicate: influence
      other_spec_node_id: security.dataclassification
      reason: SSRF reaches services on the private network, not a workspace data
        classification; its impact is on whatever internal service answers.
      decided_by: agent
      decided_at: 2026-11-19T16:36:34.016Z
      changeset: changeset-1795099306929-dmd727eav
  metadata:
    created_at: 2026-11-19T16:18:36.733Z
    updated_at: 2026-11-19T16:18:36.733Z
    version: 1
