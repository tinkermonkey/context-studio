id: changeset-1795523822316-4a5e1oqmy
name: dr-spec-export-missing-reference
description: "#1623: one operation without a DR reference no longer blocks a
  whole DR spec export. An attribute or relationship-type create whose operation
  carries no DR reference reads the reference from the entity it created, as it
  is now (so adding the reference later repairs the export); if there is still
  none, the operation is listed under skipped with why and how to fix it, and
  the rest of the proposal exports. Done when get_spec_changes and
  export_dr_spec_changes.py export proposal ce4bfe6b's eight other operations."
