id: changeset-1795523401637-q2buw60jm
name: url-sources-refuse-private-addresses
description: "Fix #1656: URL sources refuse loopback, private, link-local and
  other non-public addresses. The fetcher vets the address when it connects (a
  guarded httpcore network backend), checks every redirect hop itself, ignores
  proxy environment variables, and allows only the reference proxy's loopback
  origin. sources.allow_private_urls (default false) is the explicit exception."
