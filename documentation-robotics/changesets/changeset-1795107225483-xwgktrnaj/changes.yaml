    layer_id: motivation
    name: Landed Proposals Are Undone by a Reversal Proposal
    description: "A landed proposal cannot be reverted in place; the Revert control
      offers 'Propose the reversal…', which explains why and creates a new
      proposal from the run's change events. Only one open reversal per
      proposal; the two proposals link each other (reverses / reversed_by)
      through #1624's proposal-link model."
    attributes:
      requirementType: functional
      priority: high
      documentation: Owner decisions 2 and 4.
