    type: requirement
    layer_id: motivation
    name: Reason Codes for Every Reject
    description: Every reject, of any operation kind and in bulk, takes one reason
      code from a single set (not_in_text, mentioned_only, too_generic,
      duplicate, out_of_scope, incorrect, keep_current, outdated, other) plus an
      optional note (required only for a gold element). Buttons are filtered by
      operation kind; outdated leads when the operation is stale. System
      rejections keep their text and no code.
    attributes:
      requirementType: functional
      priority: high
      documentation: "Owner decision 1. Three new codes: incorrect, keep_current,
        outdated. No migration: reason_code is String(20)."
