    name: One Review Surface
    description: "#1635: /app/proposals/$id is the only place a proposal is
      reviewed. One list, one inspector for every operation kind, one header,
      one URL scheme; a source pane only when the proposal cites a passage.
      Compare stays a separate page using the same pills."
    attributes:
      priority: high
      documentation: "Approved design: review-design-3 proposal (owner decisions 19
        Nov 2026). Replaces the separate /review page and the proposal-detail
        table so every proposal (extraction, client plan, MCP, bundle,
        reflection, gold check, reversal) is reviewed the same way."
    metadata:
      created_at: 2026-11-19T16:59:05.120Z
      updated_at: 2026-11-19T16:59:05.120Z
      version: 1
    accepted_gaps:
