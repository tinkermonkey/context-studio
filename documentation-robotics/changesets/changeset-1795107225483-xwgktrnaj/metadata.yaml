        name: Reversal Planning
        description: "Plans the reversal of a landed proposal from its run's change
          events, newest first: create to delete, update to update with fields =
          previous_state (base = current values, so staleness is detected), move
          fields to move, delete to a restore create that keeps the snapshot's
          id, relationship side effects to delete plus create; wires $refs
          between the planned operations (domain/versioning/reversal.py)."
        attributes:
          documentation: PR 10. Owned by ProposalService.propose_reversal; refuses while
            an open reversal of the same proposal exists.
