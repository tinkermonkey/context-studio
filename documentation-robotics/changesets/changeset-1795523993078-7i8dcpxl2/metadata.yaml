        name: A proposer withdraws its open proposal
        description: "#1624: a proposer withdraws an open proposal it no longer stands
          behind, optionally naming the proposal that supersedes it (a
          supersedes link). Its undecided operations become withdrawn (not a
          reviewer's decision, so not gold); applied ones stand. A proposal with
          nothing applied becomes withdrawn; one with applied operations becomes
          done. propose_changes can name the proposals a new one supersedes,
          which withdraws them in the same call."
