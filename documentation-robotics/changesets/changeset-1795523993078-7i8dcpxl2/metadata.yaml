id: changeset-1795523993078-7i8dcpxl2
name: proposal-links
description: "#1624, design reviewed by the owner 2026-11-24: one proposal-link
  model (proposal_links: source, kind supersedes|reverses, target) covers
  withdraw-and-supersede and #1667's reversal link, replacing the
  one-review-surface plan's change_proposals.reverses_id. Amend changes pending
  operations of an open proposal in place (replace by seq, add, remove), keeping
  earlier versions on the operation (amended_at, amendments); no link, as amend
  leaves one proposal (confirmed). New operation and proposal status withdrawn
  (confirmed). Withdraw undoes an open proposal whole: what it applied is rolled
  back as a revert does, its undecided operations become withdrawn, and it ends
  withdrawn, never half-applied; a conflicting rollback is refused with its
  blockers. It can name the proposal that supersedes it; propose_changes can
  name proposals it supersedes. MCP tools amend_proposal and withdraw_proposal,
  REST POST /api/proposals/{id}/amend and /withdraw. One autogenerated migration
  after #1628's."
