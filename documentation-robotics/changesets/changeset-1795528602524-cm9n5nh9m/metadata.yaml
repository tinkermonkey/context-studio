id: changeset-1795528602524-cm9n5nh9m
name: grounding-wizard-batch
description: "#1504: the grounding wizard grounds several classes at once: one
  run per selected class, enqueued as one batch through the existing batch route
  (node_id, node_type, configuration_ref, sources per run). Source names come
  from GET /api/reference/status, the names the grounding adapter registers; no
  second list. Classes only: grounding's node_id resolves classes, so property
  definitions are not offered. There is no batch toggle: one node is one run,
  several are a batch."
