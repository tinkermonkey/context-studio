id: changeset-1795523662396-kdrvrsmtm
name: proposal-list-filters
description: "#1634 + #1626: the proposals list (REST GET /api/proposals and MCP
  list_proposals, one shared query in proposal_repo._filtered). landed=false
  leaves out proposals with nothing to land: no applied operation, re-imports
  (source bundle) and any proposal with dataset_id set. New filters dataset_id,
  source_id (client_metadata.source_id) and pipeline_type (origin.pipeline_type)
  in the query with a correct total, and a summary form (fields=summary) that
  returns operation counts grouped by op, kind, status and scope instead of
  operations. The Proposals list and the Benchmark gold page use the summary
  form."
