id: changeset-1795527082674-c14v51j8a
name: review-only-proposals
description: "#1628 (owner's decisions 2026-11-20): a proposal-level review_only
  flag, set at create time and kept on the proposal
  (change_proposals.review_only, autogenerated migration), excludes the proposal
  from auto-apply whatever the taxonomy's policy says; the benchmark gold check
  sets it, and its post-create pending check becomes a safety net. Separately,
  an operation with no probability never satisfies the policy's probability rule
  (min_probability, 0 included); bundle imports keep their exemption."
