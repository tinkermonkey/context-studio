- type: add
  elementId: technology.technologyinterface.local-server-loopback-port
  layerName: technology
  after:
    id: 576fae10-45fb-42d9-927e-0cc6f31a505a
    path: technology.technologyinterface.local-server-loopback-port
    spec_node_id: technology.technologyinterface
    type: technologyinterface
    layer_id: technology
    name: Local Server Loopback Port
    description: "The back end's HTTP port, bound by the server itself on 127.0.0.1
      and ::1 (both loopback names reach it, #1692; never a LAN address). Port
      8765 preferred (decided on #1671; dev keeps 8000), else a free port the OS
      picks; the bound port is announced to the shell on stdout and written to
      the runtime discovery file. Carries the UI, /api and /mcp at one origin."
    attributes:
      protocol: http
    metadata:
      created_at: 2026-11-24T13:56:14.952Z
      updated_at: 2026-11-24T13:56:14.952Z
      version: 1
