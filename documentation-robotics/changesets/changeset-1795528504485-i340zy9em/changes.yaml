    path: motivation.requirement.desktop-size-and-start-up-budget
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Desktop Size and Start-up Budget
    description: "Decided on #1671 (owner, 2026-11-24): the signed DMG at most 600
      MB and the installed app at most 1.6 GB with torch; a window (splash)
      within 1 s; the UI usable within 10 s on a warm start and 30 s on the
      first launch after install (Gatekeeper's first scan, migrations and the
      first reindex included). If measurement misses the size budget, embeddings
      move from torch to ONNX Runtime."
    attributes:
      requirementType: non-functional
      priority: high
    metadata:
      created_at: 2026-11-24T13:56:24.128Z
      updated_at: 2026-11-24T13:56:24.128Z
      version: 1
  timestamp: 2026-11-24T14:12:20.100Z
  sequenceNumber: 56
