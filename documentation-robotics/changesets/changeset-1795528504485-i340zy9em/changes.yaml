- type: add
  elementId: technology.technologyprocess.desktop-release-build
  layerName: technology
  after:
    id: 03920ab5-d694-4d2a-aad4-d2282842c5df
    path: technology.technologyprocess.desktop-release-build
    spec_node_id: technology.technologyprocess
    type: technologyprocess
    layer_id: technology
    name: Desktop Release Build
    description: "Builds the app on macOS: build /ux; install the runtime-only
      requirements into the standalone CPython; compile bytecode; place the
      server package and the embedding model; sign every .so, .dylib and
      executable in Resources (about 670 today), then tauri build signs the
      shell and the app and makes the DMG. With a Developer ID Application
      certificate it signs with hardened runtime and a timestamp and notarizes
      and staples; that certificate is still open on #1671, so until then the
      build is ad-hoc signed and runs on the build machine only."
    metadata:
      created_at: 2026-11-24T13:56:14.957Z
      updated_at: 2026-11-24T13:56:14.957Z
      version: 1
  timestamp: 2026-11-24T14:12:20.463Z
  sequenceNumber: 13
- type: add
  elementId: application.applicationprocess.local-server-lifecycle
  layerName: application
  after:
    id: 4aa94130-bc86-4d04-8805-9ae945a9ddaf
    path: application.applicationprocess.local-server-lifecycle
    spec_node_id: application.applicationprocess
    type: applicationprocess
    layer_id: application
    name: Local Server Lifecycle
    description: "Run by the desktop shell: spawn python -I with the entry module
      and the app-data config path, stdin and stdout piped; read the ready line
      with the bound port; poll /api/v1/admin/health; on quit close stdin, wait
      10 s for a graceful exit, then kill. A pid lock in app-data lets the next
      launch stop an orphan left by a crash."
    metadata:
      created_at: 2026-11-24T13:56:14.962Z
      updated_at: 2026-11-24T13:56:14.962Z
      version: 1
  timestamp: 2026-11-24T13:56:14.983Z
  sequenceNumber: 14
- type: add
  elementId: application.applicationprocess.local-server-start-up
  layerName: application
  after:
    id: 6c687f58-5759-4c92-af31-84671b8ce8e0
    path: application.applicationprocess.local-server-start-up
    spec_node_id: application.applicationprocess
    type: applicationprocess
    layer_id: application
    name: Local Server Start-up
    description: "The desktop entry point before serving: set SSL_CERT_FILE to
      certifi's bundle (#1509); resolve config.json, databases and the log
      folder (~/Library/Logs/<bundle id>/) from the app-data path; back up each
      database and run Alembic upgrade head on local.db and operations.db; bind
      the loopback sockets (preferred port, else a free one); print the ready
      line; write the runtime discovery file; exit when stdin closes (the shell
      is gone)."
    metadata:
      created_at: 2026-11-24T13:56:14.964Z
      updated_at: 2026-11-24T13:56:14.964Z
      version: 1
  timestamp: 2026-11-24T13:56:14.983Z
  sequenceNumber: 15
