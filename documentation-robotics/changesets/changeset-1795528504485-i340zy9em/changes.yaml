    path: motivation.constraint.mac-os-on-apple-silicon-first
    spec_node_id: motivation.constraint
    type: constraint
    layer_id: motivation
    name: macOS on Apple Silicon First
    description: "Decided on #1671 (owner, 2026-11-24): the MVP's packaged build
      targets macOS on Apple Silicon (aarch64-apple-darwin) only. Intel Macs
      cannot run torch 2.3 or later, which publishes no macOS x86_64 wheels;
      Windows and Linux are later work with their own CI runners, signing and
      torch builds."
    attributes:
      constraintType: technical
    metadata:
