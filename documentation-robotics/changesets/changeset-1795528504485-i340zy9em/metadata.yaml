id: changeset-1795528504485-i340zy9em
name: desktop-packaging
description: "#1671, technology layer, decided by the owner on 2026-11-24
  (notarization still open): package Context Studio
  (com.tinkermonkey.contextstudio) as a Tauri v2 desktop app for macOS on Apple
  Silicon. The Tauri shell starts the back end from a bundled standalone CPython
  3.14 (no PyInstaller), waits for health, supervises it and stops it with the
  app; the back end binds its own loopback sockets (127.0.0.1 and ::1, #1692) on
  port 8765 with a free-port fallback and runtime.json for MCP clients, serves
  the built /ux at the same origin, runs Alembic on start, and keeps config.json
  (with the LLM keys and MCP token, 0600), the databases and logs in the
  platform's app-data and log folders. The bundle carries the runtime, the
  server package, the UI build and the embedding model; certifi supplies TLS
  roots (#1509). No updater: signed DMGs on GitHub Releases. Done when the build
  issues filed from it are built and verified."
