    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: A long text field is proposed as anchored edits
    description: "#1630: a client changes part of a description or a taxonomy vision by edits anchored on the existing text (insert after an anchor, replace an anchor, delete an anchor), applied in order, instead of resending the whole value. The proposal is refused if an anchor is missing or appears more than once. Adding one bullet to a 7,000-character vision takes one short edit."
    attributes:
      requirementType: functional
      priority: high
    metadata:
      created_at: 2026-11-25T02:12:36.072Z
      updated_at: 2026-11-25T02:12:36.072Z
      version: 1
