- type: add
  elementId: application.applicationfunction.anchored-text-edits
  layerName: application
  after:
    id: 14637868-2c83-4c7a-88e4-6271802fb97d
    path: application.applicationfunction.anchored-text-edits
    spec_node_id: application.applicationfunction
    type: applicationfunction
    layer_id: application
    name: Anchored text edits
    description: "apply_text_edits (domain/versioning/text_edits.py) applies an ordered list of anchored edits to a text and names the edit whose anchor is missing or not unique. ProposalService uses it three ways: at propose and amend it resolves an update's edits against the current text into the operation's fields and base (and keeps the edits); at apply it applies them again to the current text and records the text it applied to; and staleness asks whether the anchors still match instead of comparing the field with base."
    metadata:
      created_at: 2026-11-25T02:12:36.073Z
      updated_at: 2026-11-25T02:12:36.073Z
      version: 1
    source_reference:
      provenance: manual
      locations:
