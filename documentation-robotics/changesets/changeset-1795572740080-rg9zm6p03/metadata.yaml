id: changeset-1795572740080-rg9zm6p03
name: anchored-text-edits
description: "#1630: A client proposes a change to a long text field (description, vision) as anchored edits instead of a whole new value; the edits are applied to the field's current text at accept, and an operation whose anchor no longer matches is stale instead of overwriting. Done when propose_changes, amend and the REST API take edits, apply rebases them, and review shows the change and why it went stale."
