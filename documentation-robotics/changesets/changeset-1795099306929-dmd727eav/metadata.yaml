id: changeset-1795099306929-dmd727eav
name: rebuild-model-from-code
description: "Rebuild Context Studio's DR model so it is complete and accurate
  against the code at 2594d7a4 (2026-11-19), as the base for change management.
  Code layers (application, api, data-model, data-store, technology, ux,
  navigation, apm, testing) rebuilt from extraction: all 171 OpenAPI operations
  plus /mcp with handlers that exist, request/response links checked against
  openapi.json, 35 SQLAlchemy tables with FKs and unique keys, 51 hexagonal
  ports, UX views bound to the API through 140 data configs, testing modelled at
  suite level. Hand-written layers (motivation, business, product, security)
  rewritten from an audit with the owner's answers (workbench goals and
  principles, DR and House as separate clients, Tauri desktop goal, security
  threats incl. #1655 LAN exposure and #1656 SSRF as requirements to fix). Done:
  model_validate 0 errors and 0 orphans; a full extraction preview of the code
  layers (testing aside) stages nothing and leaves no cards or candidate
  deletes."
