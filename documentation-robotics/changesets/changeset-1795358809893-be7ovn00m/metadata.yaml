    change:
      type: add
      elementId: application.applicationfunction.individual-pre-review
      layerName: application
      after:
        id: a70825fd-8882-4682-9bff-f8c25814c6b6
        path: application.applicationfunction.individual-pre-review
        spec_node_id: application.applicationfunction
        type: applicationfunction
        layer_id: application
        name: Individual Pre-Review
        description: "The pre_review stage of single_call
          (domain/extraction/pre_review.py, called from SingleCallOrchestrator
          between find_individuals and derive_relationships, so relationships
          are read between the reviewed individuals and their reviewed classes).
          One LLM call per section (the same sections find_individuals read),
          against the same class catalog with whole definitions in a cached
          system prompt, given the section's text and its numbered individuals
          (title, class, quote). It asks two questions from a small bank kept as
          data: split (applies only where the split witness fires) and retype
          (applies to every element: name the strongest other class, compare the
          two definitions, and change only when the other is clearly better,
          citing the deciding sentence). It answers per element with keep, split
          (the parts, each with a title, class and quote), retype (the class,
          the class compared, the reasoning) or unsure (a question for the
          reviewer). An answer naming an unknown class or a part with no quote
          in the text is dropped with a warning and the element kept as
          extracted; a failed or cut-off call leaves its section's elements
          unreviewed, reported in the run's metadata (reviewed, changed and
          not-reviewed counts, tokens split by input, cache and output), never
          failing the run. Settings in the configuration: pre_review {enabled,
          model, effort, max_tokens, questions}; the configuration's digest
          records them in the proposal's origin."
        attributes:
          documentation: "Input: section text, catalog, individuals. Output:
            per-individual PreReviewVerdict; the orchestrator replaces a split
            individual by its parts and a retyped one's class before relating."
        metadata:
          created_at: 2026-11-22T14:48:01.263Z
          updated_at: 2026-11-22T14:48:01.263Z
          version: 1
      timestamp: 2026-11-22T14:48:01.295Z
