        description: The pre_review stage (domain/extraction/pre_review.py
          review_individuals; ExtractionService.review_individuals), called by
          SingleCallOrchestrator between find_individuals and
          derive_relationships when the configuration has a pre_review setting
          {model, effort, max_tokens}. One LLM call per section, against the
          same class catalog in a cached system prompt, given the section's text
          and its numbered individuals. It asks the split question where the
          split witness fires and the retype question of every individual, and
          answers split, retype or unsure per individual. The orchestrator
          replaces a split individual by its parts and gives a retyped one its
          new class before relating. An unusable answer keeps its individual as
          extracted; a failed call keeps the section's individuals and counts
          them as not reviewed in the run's metadata, never failing the run.
        attributes:
          documentation: "Input: section text, catalog, individuals. Output:
            per-individual PreReviewVerdict; the orchestrator replaces a split
            individual by its parts and a retyped one's class before relating."
