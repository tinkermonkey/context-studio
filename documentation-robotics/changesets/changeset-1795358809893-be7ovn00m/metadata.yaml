id: changeset-1795358809893-be7ovn00m
name: extraction-pre-review-stage
description: "Design of an optional pre-review stage in single_call individual
  extraction (issue to be filed). After find_individuals and before relate, one
  LLM call per section asks two questions of every extracted individual: is it
  one item or several (split), and is its class the best fit compared with the
  classes it could be confused with (retype). Each verdict reaches the proposal
  as a visible change: a retype keeps the extracted class as an alternative, a
  split's parts name the item they came from, and both carry the stage's
  reasoning, shown in the Review inspector with a one-key way back. It is off by
  default and turned on by a configuration setting; whether it becomes the
  default is decided by a decision rule fixed before any paid run (seeded
  errors, the human-checked benchmark gold and Gate D's reviewed runs, three
  takes). Plan only: nothing is built until the user approves."
