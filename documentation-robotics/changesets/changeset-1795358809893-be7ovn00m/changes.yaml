- type: add
  elementId: motivation.assessment.splits-and-retypes-are-half-of-reviewer-changes
  layerName: motivation
  after:
    id: 2c70a84a-685c-4f98-b4a4-a28096a97531
    path: motivation.assessment.splits-and-retypes-are-half-of-reviewer-changes
    spec_node_id: motivation.assessment
    type: assessment
    layer_id: motivation
    name: Splits and Retypes Are Half of Reviewer Changes
    description: "Gate D (2026-11-21, one take per document, one reviewer): 15 of
      the 29 rejections and retypes the person made on two real documents came
      down to two questions: one item or several (4 House nodes naming two or
      three tools or kits) and the better class (11 retypes, 5 on the DR viewer
      README). The DR document had no splits; its other 5 rejections were 'not
      an element' (dependencies or facts stated as elements). Only DR's half
      reflects real use. Source:
      documentation/extraction/experiments/2026-11-21-gate-d-real-documents.md
      and the Gate D reading in rearchitecture/ontology_workbench_proposal.md
      (not yet committed, 2026-11-22)."
    attributes:
      assessmentType: gap
    metadata:
      created_at: 2026-11-22T14:48:01.245Z
      updated_at: 2026-11-22T14:48:01.245Z
      version: 1
  timestamp: 2026-11-22T14:51:40.924Z
  sequenceNumber: 0
- type: add
  elementId: motivation.requirement.pre-review-changes-show-what-changed-and-why
  layerName: motivation
  after:
    id: 395d8262-4e37-4bd3-9de5-a0a3118e173a
    path: motivation.requirement.pre-review-changes-show-what-changed-and-why
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Pre-Review Changes Show What Changed and Why
    description: "Every change the pre-review stage makes to an extracted element (a
      retype or a split) reaches the proposal as a visible change: the reviewer
      sees the element as extracted, what the stage changed, and the stage's
      reasoning, and restores the original in one action. The stage never
      changes an element silently, and an element it did not review (its call
      failed or was cut off) is reported as not reviewed, never dropped."
    attributes:
      requirementType: functional
      priority: high
    metadata:
      created_at: 2026-11-22T14:48:01.259Z
      updated_at: 2026-11-22T14:48:01.259Z
      version: 1
  timestamp: 2026-11-22T14:48:01.295Z
  sequenceNumber: 1
- type: add
  elementId: motivation.requirement.pre-review-is-adopted-only-by-a-rule-set-in-advance
  layerName: motivation
  after:
    id: dac63203-d159-46aa-b5f3-952ec5cdfebc
    path: motivation.requirement.pre-review-is-adopted-only-by-a-rule-set-in-advance
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Pre-Review Is Adopted Only by a Rule Set in Advance
    description: "The pre-review stage stays off by default until a decision rule
      written on its experiment page before the first paid run adopts it: it
      must cut the reviewer's split and retype changes without losing typed F1,
      measured over three paired takes on human-checked gold, with its own
      changes' precision and its false-change rate on correct elements bounded."
    attributes:
      requirementType: quality
      priority: high
    metadata:
      created_at: 2026-11-22T14:48:01.260Z
      updated_at: 2026-11-22T14:48:01.260Z
      version: 1
  timestamp: 2026-11-22T14:48:01.295Z
