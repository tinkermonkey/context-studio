- type: add
  elementId: ux.subview.pre-review-note
  layerName: ux
  after:
    id: b306c632-6f1f-4ac0-ae2a-ad70d2b78687
    path: ux.subview.pre-review-note
    spec_node_id: ux.subview
    type: subview
    layer_id: ux
    name: Pre-Review Note
    description: "A block of the review inspector for an element the stage changed
      or questioned: 'Retyped from <class> by pre-review' or 'Split from
      <original title>', the stage's reasoning and the class it compared, with
      Restore (key R) choosing the extracted class alternative; an unsure
      verdict shows its question. Its pill carries a marker so the reviewer sees
      what the stage touched before opening it. A split's restore is not offered
      (the Review page cannot merge, #1673): the reviewer rejects the extra
      parts and edits one part's title."
    attributes:
      title: Pre-review
      description: What the pre-review stage changed on this element and why, with a
        one-key restore.
    metadata:
      created_at: 2026-11-22T14:48:01.270Z
      updated_at: 2026-11-22T14:48:01.270Z
      version: 1
