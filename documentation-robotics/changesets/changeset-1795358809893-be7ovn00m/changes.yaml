    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Extraction Pre-Review
    description: "An optional stage of individual extraction that reviews each
      extracted element before a person does: it splits an element that names
      several things and retypes one whose class is not the best fit. Built
      behind a pipeline configuration's pre_review setting, which no built-in
      configuration has. Assessed 2026-11-23
      (documentation/extraction/experiments/2026-11-22-pre-review-stage.md):
      inconclusive, so it stays off; showing its verdicts in a proposal is not
      built."
    attributes:
