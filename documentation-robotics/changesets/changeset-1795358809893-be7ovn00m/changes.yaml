- type: add
  elementId: data-model.schemaproperty.pre-review
  layerName: data-model
  after:
    id: b3acdb27-e5ca-4c96-a169-3ed93c0fb133
    path: data-model.schemaproperty.pre-review
    spec_node_id: data-model.schemaproperty
    type: schemaproperty
    layer_id: data-model
    name: pre_review
    description: "Proposed Operation's pre_review: the Pre-Review Verdict behind an
      individual create the stage changed or questioned (null otherwise). A
      retype also lists the extracted class as an alternative {kind: class,
      class_id, by: extraction}, so restoring it is choosing that alternative
      and the gold record keeps it as chosen_alternative. A split part names the
      element it came from. An operation with a pre_review other than keep never
      auto-applies under an approval policy."
    attributes:
      type: object
    metadata:
      created_at: 2026-11-22T14:48:01.267Z
      updated_at: 2026-11-22T14:48:01.267Z
      version: 1
