    path: product.feature.extraction-pre-review
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Extraction Pre-Review
    description: "An optional stage of individual extraction that reviews each
      extracted element before a person does: it splits an element that names
      several things and retypes one whose class is not the best fit, showing
      each change and its reason in the Review inspector. Turned on per pipeline
      configuration (extraction-single-call-reviewed); off in the default
      configuration until its assessment adopts it."
    attributes:
      priority: medium
      status: proposed
      size: m
    metadata:
      created_at: 2026-11-22T14:48:01.260Z
      updated_at: 2026-11-22T14:48:01.260Z
