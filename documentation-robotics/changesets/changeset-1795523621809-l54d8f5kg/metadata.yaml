name: not-an-element-opens-reasons
description: '#1672: on the Review page, "Not an element" / "Not a relationship"
  (and key X) visibly open the reason step instead of only moving focus: the
  reasons block scrolls into view, is highlighted and says to pick a reason, and
  the first reason is focused; in gold mode with no note yet, the note field is
  focused and the "Write why" message shows. Done when the button never does
  nothing and a component test covers normal and gold mode.'
