id: changeset-1795526335897-lbb9knj28
name: relationship-end-search-and-reverse
description: "#1673: on the review inspector, a relationship's Source and Target
  rows search this proposal's elements that aren't rejected (a pending one by
  its \"$ref\", resolved when it applies) as well as the dataset's individuals,
  and say why nothing is listed; a Reverse control swaps the ends and, when the
  predicate doesn't allow the reversed direction, offers the predicates that do
  or says none does. Back end: a relationship create's edit may name an element
  of the proposal by \"$ref\" (the apply path already resolves it). Done when a
  component test on a fresh proposal finds a pending element and reverses the
  ends, and a service test applies an edit naming an element by its ref."
