id: changeset-1795523769454-gmn47iyq6
name: config-bad-field-falls-back
description: "#1650: one invalid value in config.json no longer discards the
  file. An invalid value is logged with its field name and takes its default; a
  null LLM key means not set. With no LLM key the app starts, the router has no
  providers, and calls that need a model refuse naming the llm.* fields (health
  issue, chat status and run errors say why)."
