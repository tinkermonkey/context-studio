id: changeset-1795523224015-g471vxf35
name: cross-context-rule
description: "#1633: record and enforce the cross-context rule. A context may
  depend on another context's ports, entities, value objects, exceptions and the
  public methods of its injected application service; never its adapters,
  private members or ambient globals. OperationDraft moves into versioning's
  value-object module (proposals.py); extraction passes its run id on
  ExtractionCompleted instead of setting the ambient batch-run context; the
  backward-compatible set_import_run_context goes; check_domain_imports.py
  checks the rule. Done when the docs (domain_model_design.md §11,
  architecture_design.md §4) state the rule and graph, and the check fails on a
  violation."
