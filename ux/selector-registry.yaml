# Context Studio — Selector Registry
# All data-testid attributes used in E2E tests must be registered here.
# Run `npm run validate-selectors` to verify contract integrity.
#
# Format:
#   selector: data-testid value
#   component: source component file
#   description: what this element represents

selectors:
  # Workspace Switcher
  - selector: workspace-switcher-overlay
    component: components/layout/WorkspaceSwitcher.tsx
    description: Workspace switcher overlay backdrop
  - selector: workspace-switcher-modal
    component: components/layout/WorkspaceSwitcher.tsx
    description: Workspace switcher modal

  # Toast
  - selector: toast-action-*
    component: components/ui/Toast.tsx
    description: Action button in toast with undo callback

  # Drawer
  - selector: drawer-autosave-status
    component: components/ui/Drawer.tsx
    description: Autosave status indicator showing save state
  - selector: drawer-revert-button
    component: components/ui/Drawer.tsx
    description: Revert button visible when content is dirty
  - selector: drawer-delete-button
    component: components/ui/Drawer.tsx
    description: Delete action button in drawer

  # EmptyState
  - selector: empty-state
    component: components/ui/EmptyState.tsx
    description: Empty state container with icon, title, and action
  - selector: empty-state-action
    component: components/ui/EmptyState.tsx
    description: Call-to-action button in empty state

  # ConfirmDialog
  - selector: confirm-dialog
    component: components/ui/ConfirmDialog.tsx
    description: Confirmation dialog body
  - selector: confirm-dialog-cancel
    component: components/ui/ConfirmDialog.tsx
    description: Cancel button in confirmation dialog
  - selector: confirm-dialog-confirm
    component: components/ui/ConfirmDialog.tsx
    description: Confirm/affirmative button in confirmation dialog

  # TypeToConfirmDialog
  - selector: type-confirm-dialog
    component: components/ui/TypeToConfirmDialog.tsx
    description: Type-to-confirm dialog body
  - selector: type-confirm-input
    component: components/ui/TypeToConfirmDialog.tsx
    description: Text input for confirming destructive action
  - selector: type-confirm-button
    component: components/ui/TypeToConfirmDialog.tsx
    description: Destructive action button in type-confirm dialog
  - selector: type-confirm-cancel
    component: components/ui/TypeToConfirmDialog.tsx
    description: Cancel button in type-confirm dialog

  # Schema Components
  - selector: schema-page-layout
    component: components/schema/SchemaPageLayout.tsx
    description: Main split-pane layout container with table and drawer
  - selector: schema-table
    component: components/schema/SchemaTable.tsx
    description: Main table container for schema entities
  - selector: schema-header-*
    component: components/schema/SchemaTable.tsx
    description: Table header cell with optional sort indicator
  - selector: schema-row-*
    component: components/schema/SchemaTable.tsx
    description: Table row for entity with dynamic ID suffix
  - selector: schema-pagination-prev
    component: components/schema/SchemaTable.tsx
    description: Previous page button in table pagination
  - selector: schema-pagination-next
    component: components/schema/SchemaTable.tsx
    description: Next page button in table pagination
  - selector: schema-search-input
    component: components/schema/FilterBar.tsx
    description: Search input for filtering table rows
  - selector: schema-filter-bar
    component: components/schema/FilterBar.tsx
    description: Filter bar container with search and filter chips
  - selector: schema-drawer-container
    component: components/schema/SchemaPageLayout.tsx
    description: Drawer container when entity is selected

  # Property Definition Form
  - selector: property-definition-form
    component: components/schema/PropertyDefinitionForm.tsx
    description: Form for creating/editing property definitions
  - selector: property-definition-identifier-input
    component: components/schema/PropertyDefinitionForm.tsx
    description: Snake-case identifier input field
  - selector: property-definition-title-input
    component: components/schema/PropertyDefinitionForm.tsx
    description: Display name input field
  - selector: property-definition-description-input
    component: components/schema/PropertyDefinitionForm.tsx
    description: Description textarea for property definition
  - selector: property-definition-submit-button
    component: components/schema/PropertyDefinitionForm.tsx
    description: Submit button for property form

  # Property Drawer
  - selector: property-drawer
    component: components/ontology/PropertyDrawer.tsx
    description: Drawer for editing property definition details
  - selector: property-drawer-identifier
    component: components/ontology/PropertyDrawer.tsx
    description: Read-only identifier field in property drawer
  - selector: property-drawer-title-input
    component: components/ontology/PropertyDrawer.tsx
    description: Editable title field in property drawer
  - selector: property-drawer-description-input
    component: components/ontology/PropertyDrawer.tsx
    description: Editable description field in property drawer
  - selector: property-delete-confirm
    component: components/ontology/PropertyDrawer.tsx
    description: Confirmation dialog for property deletion

  # Properties Page
  - selector: property-add-button
    component: routes/app/schema/properties.tsx
    description: Button to open create property modal
  - selector: property-create-modal
    component: routes/app/schema/properties.tsx
    description: Modal for creating new property definition
  - selector: property-create-form
    component: routes/app/schema/properties.tsx
    description: Create property form inside modal
  - selector: properties-page
    component: routes/app/schema/properties.tsx
    description: Main properties page container
  - selector: properties-filter-bar
    component: routes/app/schema/properties.tsx
    description: Filter bar on properties page
  - selector: properties-table
    component: routes/app/schema/properties.tsx
    description: Properties table container
  - selector: properties-drawer
    component: routes/app/schema/properties.tsx
    description: Property drawer on properties page
  - selector: properties-empty-state
    component: routes/app/schema/properties.tsx
    description: Empty state shown when no properties exist
  - selector: property-row-actions-*
    component: routes/app/schema/properties.tsx
    description: Actions menu button for property row
  - selector: properties-content
    component: routes/app/schema/properties.tsx
    description: Main content area of properties page

  # Relationship Drawer
  - selector: relationship-drawer
    component: components/ontology/RelationshipDrawer.tsx
    description: Drawer for viewing relationship details
  - selector: relationship-drawer-id
    component: components/ontology/RelationshipDrawer.tsx
    description: Read-only ID field in relationship drawer
  - selector: relationship-drawer-source-class
    component: components/ontology/RelationshipDrawer.tsx
    description: Read-only source class field in relationship drawer
  - selector: relationship-drawer-target-class
    component: components/ontology/RelationshipDrawer.tsx
    description: Read-only target class field in relationship drawer
  - selector: relationship-drawer-property-type
    component: components/ontology/RelationshipDrawer.tsx
    description: Read-only property type field in relationship drawer

  # Relationships Page
  - selector: relationship-add-button
    component: routes/app/schema/relationships.tsx
    description: Button to open create relationship dialog
  - selector: relationships-page
    component: routes/app/schema/relationships.tsx
    description: Main relationships page container
  - selector: relationships-content
    component: routes/app/schema/relationships.tsx
    description: Main content area of relationships page
  - selector: relationship-row-actions-*
    component: routes/app/schema/relationships.tsx
    description: Actions menu button for relationship row
