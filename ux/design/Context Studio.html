    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: rgb(var(--shell-bg));
      }
      body {
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        height: 100vh;
      }
      #cs-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(var(--shell-bg));
        color: rgb(var(--shell-fg-3));
        font-family: var(--font-mono);
        font-size: 12px;
        z-index: 1;
      }
      #cs-boot.hidden {
        display: none;
      }
      #cs-boot-bar {
        width: 360px;
        height: 1px;
        margin-top: 18px;
        background: rgb(var(--shell-border));
        position: relative;
        overflow: hidden;
      }
      #cs-boot-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgb(var(--accent-primary));
        transform: translateX(-100%);
        animation: csBoot 1.6s ease-in-out infinite;
      }
      @keyframes csBoot {
        0% {
          transform: translateX(-100%);
        }
        60% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(100%);
        }
      }
      #cs-err {
        position: fixed;
        inset: 24px;
        overflow: auto;
        z-index: 100;
        color: #fca;
        font-family: var(--font-mono);
        font-size: 12px;
        white-space: pre-wrap;
        padding: 20px;
        background: #2a0a0a;
        border: 1px solid #c33;
        border-radius: 8px;
        display: none;
      }
    </style>
  </head>
  <body class="dark-canvas">
    <div id="cs-boot">
      <div>
        <div style="display: flex; align-items: center; gap: 10px; justify-content: center">
          <div
            style="
              width: 14px;
              height: 14px;
              border-radius: 3px;
              background: linear-gradient(
                135deg,
                rgb(var(--accent-primary)),
                rgb(var(--accent-primary-deep))
              );
            "
          ></div>
          <span style="color: rgb(var(--shell-fg-2)); font-weight: 500">Context Studio</span>
        </div>
        <div id="cs-boot-status" style="text-align: center; margin-top: 10px; font-size: 11px">
          Booting Heimdall components…
        </div>
        <div id="cs-boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <div id="cs-err"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script src="data.js"></script>

    <script>
      Object.assign(window, {
        useState: React.useState,
        useEffect: React.useEffect,
        useMemo: React.useMemo,
        useCallback: React.useCallback,
        useRef: React.useRef,
        useLayoutEffect: React.useLayoutEffect,
        useImperativeHandle: React.useImperativeHandle,
        useContext: React.useContext,
        useReducer: React.useReducer,
        useId: React.useId,
        useTransition: React.useTransition,
        useDeferredValue: React.useDeferredValue,
        useSyncExternalStore: React.useSyncExternalStore,
        Fragment: React.Fragment,
        forwardRef: React.forwardRef,
        memo: React.memo,
        createContext: React.createContext,
        createRef: React.createRef,
        Children: React.Children,
        cloneElement: React.cloneElement,
        isValidElement: React.isValidElement,
      });

      const HEIMDALL_PATHS = [
        "heimdall/utils/graph.tsx",
        "heimdall/utils/graphLayout.tsx",
        "heimdall/hooks/useFocusTrap.tsx",
        "heimdall/hooks/useBodyOverflow.tsx",
        "heimdall/hooks/useDropdownMenu.tsx",
        "heimdall/components/dropdownPlacement.tsx",
        "heimdall/components/AppTitle.tsx",
        "heimdall/components/Button.tsx",
        "heimdall/components/ChartWrapper.tsx",
        "heimdall/components/ChatContainer.tsx",
        "heimdall/components/ChatDivider.tsx",
        "heimdall/components/ChatSuggestions.tsx",
        "heimdall/components/Field.tsx",
        "heimdall/components/GraphCanvasContext.tsx",
        "heimdall/components/GraphInspector.tsx",
        "heimdall/components/HierarchyRow.tsx",
        "heimdall/components/HierarchyTree.tsx",
        "heimdall/components/Icon.tsx",
        "heimdall/components/KVGrid.tsx",
        "heimdall/components/NumberInput.tsx",
        "heimdall/components/Panel.tsx",
        "heimdall/components/SegmentedControl.tsx",
        "heimdall/components/Select.tsx",
        "heimdall/components/SplitPane.tsx",
        "heimdall/components/StatGrid.tsx",
        "heimdall/components/TextArea.tsx",
        "heimdall/components/TextInput.tsx",
        "heimdall/components/Titlebar.tsx",
        "heimdall/components/Topbar.tsx",
        "heimdall/components/TriState.tsx",
        "heimdall/components/VersionPill.tsx",
        "heimdall/components/chartColors.jsx",
        "heimdall/components/chartTone.tsx",
        "heimdall/components/statusColors.tsx",
        "heimdall/components/GraphEdge.tsx",
        "heimdall/components/ChatComposer.tsx",
        "heimdall/components/ChatMessage.tsx",
        "heimdall/components/CommandPalette.tsx",
        "heimdall/components/ConfigTile.tsx",
        "heimdall/components/Drawer.tsx",
        "heimdall/components/FilterDropdown.tsx",
        "heimdall/components/FormCallout.tsx",
        "heimdall/components/Modal.tsx",
        "heimdall/components/NavItem.tsx",
        "heimdall/components/OrderedList.tsx",
        "heimdall/components/QuickAccessTile.tsx",
        "heimdall/components/RowMenu.tsx",
        "heimdall/components/Sidebar.tsx",
        "heimdall/components/Statusbar.tsx",
        "heimdall/components/Table.tsx",
        "heimdall/components/Toast.tsx",
        "heimdall/components/KeyValueEditor.tsx",
        "heimdall/components/InspectorPanel.tsx",
        "heimdall/components/BarH.tsx",
        "heimdall/components/BarV.tsx",
        "heimdall/components/Donut.tsx",
        "heimdall/components/Heatmap.tsx",
        "heimdall/components/LineChart.tsx",
        "heimdall/components/PieChart.tsx",
        "heimdall/components/StackedBar.tsx",
        "heimdall/components/StatusTimeline.tsx",
        "heimdall/components/Badge.tsx",
        "heimdall/components/BarChart.tsx",
        "heimdall/components/Chip.tsx",
        "heimdall/components/ProgressBar.tsx",
        "heimdall/components/Sparkline.tsx",
        "heimdall/components/TopologyNode.tsx",
        "heimdall/components/ConfirmDialog.tsx",
        "heimdall/components/WorkspaceSwitcherDialog.tsx",
        "heimdall/components/QuickAccessGrid.tsx",
        "heimdall/components/ShellLayout.tsx",
        "heimdall/components/ActivityTimeline.tsx",
        "heimdall/components/AlertStrip.tsx",
        "heimdall/components/EntityPicker.tsx",
        "heimdall/components/FilterBar.tsx",
        "heimdall/components/PageHeader.tsx",
        "heimdall/components/PipelineCard.tsx",
        "heimdall/components/TabBar.tsx",
        "heimdall/components/MetricRow.tsx",
        "heimdall/components/StatTile.tsx",
        "heimdall/components/RelationshipBuilder.tsx",
        "heimdall/components/GraphNode.tsx",
        "heimdall/components/GraphCanvas.tsx",
      ];
      const APP_PATHS = ["cs/pages.jsx", "cs/app.jsx"];

      const boot = async () => {
        const status = document.getElementById("cs-boot-status");
        const errEl = document.getElementById("cs-err");
        const reportErr = (path, e) => {
          errEl.style.display = "block";
          errEl.textContent += "⚠ " + path + "\n" + (e.stack || e.message || String(e)) + "\n\n";
          document.getElementById("cs-boot").classList.add("hidden");
          console.error(path, e);
        };

        const loadJSX = async (path) => {
          let src;
          try {
            const r = await fetch(path);
            if (!r.ok) throw new Error("HTTP " + r.status);
            src = await r.text();
          } catch (e) {
            reportErr(path, e);
            throw e;
          }

          let out;
          try {
            out = Babel.transform(src, {
              presets: [["typescript", { allExtensions: true, isTSX: true }], "react"],
              filename: path,
            }).code;
          } catch (e) {
            reportErr(path + " (transform)", e);
            throw e;
          }

          try {
            new Function(out)();
          } catch (e) {
            reportErr(path + " (execute)", e);
            throw e;
          }
        };

        for (let i = 0; i < HEIMDALL_PATHS.length; i++) {
          status.textContent =
            "Loading components (" + (i + 1) + "/" + HEIMDALL_PATHS.length + ")…";
          await loadJSX(HEIMDALL_PATHS[i]);
        }
        status.textContent = "Loading app…";
        for (const p of APP_PATHS) await loadJSX(p);
        document.getElementById("cs-boot").classList.add("hidden");
      };

      boot();
    </script>
  </body>
